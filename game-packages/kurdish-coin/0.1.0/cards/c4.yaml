# C4 cards (research 08; deck CSV). Encoding docs/prototype/33, DEC-69. DK-076 Area Domination is in pivotal.yaml.
# P3b-07d: legal parties and Propaganda. P3b-07e: ceasefire cards. The other C4 cards come in P3b-07f and P3b-07g.
- id: DK-056
  campaign: C4
  title: "PKK Unilateral Ceasefire (Mar 1993)"
  date: "1993-03-17"
  type: event
  unshaded:
    text: "Ceasefire not recognized: State Resources +3. The State conducts a free Garrison."
    owner: state
    tier: T0
    effects:
      - {type: adjustTrack, track: resources.state, delta: 3}
      - {type: freeAction, action: state.garrison, constraints: {}}
  shaded:
    text: "Declare Ceasefire for the PKK: Ceasefire to Declared and Europe +1 (07, section 7.1). Shift up to 2 spaces with PKK pieces and no Office one level toward Opposition."
    owner: pkk
    tier: T0
    effects:
      - {type: procedure, id: ceasefire.declare}
      - type: forEachSpace
        where: {type: all, of: [{type: spaceKind, kind: domestic}, {type: spaceHas, pieces: [guerrilla, pkkBase]}, {type: not, of: {type: spaceHas, markers: [office]}}]}
        min: 0
        max: 2
        effects:
          - {type: shiftLevel, space: selected, direction: opposition, steps: 1}
  encoding: {status: encoded, encodedBy: "P3b-07e", reviewedAgainstText: true, note: "U: the free Garrison counts for the ceasefire table (DEC-66). S: a PKK declaration (procedure shared with the command); none while a ceasefire is in force (DEC-69 point 5)"}
  eventConfidence: Moderate
  deckEligible: true
  sources: [E-0089, S-0075, S-0078, S-0184, S-0263, S-0264, S-0076, S-0077, S-0127, S-0447]
- id: DK-057
  campaign: C4
  title: "Ceasefire Extended at Bar Elias (Apr 1993)"
  date: "1993-04-16"
  type: event
  chainAfter: [DK-056]
  unshaded:
    text: "If Ceasefire is Declared, the State may accept now: Ceasefire to Reciprocal Restraint and Legitimacy +1. Otherwise no effect."
    owner: state
    tier: T0
    effects:
      - type: conditional
        if: {type: trackIn, track: ceasefire, values: [declared]}
        then:
          - type: choice
            options:
              - label: Accept the ceasefire
                effects:
                  - {type: procedure, id: ceasefire.accept}
                  - type: conditional
                    if: {type: trackIn, track: ceasefire, values: [reciprocalRestraint]}
                    then: [{type: adjustTrack, track: legitimacy, delta: 1}]
              - {label: Do not accept, effects: []}
  shaded:
    text: "If Ceasefire is None, set it to Declared. PUK posture one step toward Host. Europe +1."
    owner: pkk
    tier: T0
    effects:
      - type: conditional
        if: {type: trackIn, track: ceasefire, values: [none]}
        then:
          - {type: setTrack, track: ceasefire, value: declared}
          - {type: setFlag, flag: ceasefireDeclaredByPkk, value: true}
      - {type: stepOrdinal, track: posture.puk, direction: previous, steps: 1}
      - {type: adjustTrack, track: europe, delta: 1}
  encoding: {status: encoded, encodedBy: "P3b-07e", reviewedAgainstText: true, note: "U: not with the State Restraint Broken marker, as the ceasefire step (DEC-73). S: a PKK declaration without the declaration's own Europe +1 (DEC-69 point 6)"}
  eventConfidence: Moderate
  deckEligible: true
  sources: [E-0090, S-0075, S-0078, S-0180, S-0184, S-0263, S-0127]
