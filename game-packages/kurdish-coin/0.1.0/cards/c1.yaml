- id: DK-003
  campaign: C1
  title: "Law 3175 (Mar 1985)"
  date: "1985-03-26"
  type: event
  mandatory: true
  always:
    - {type: transferPool, piece: guards, from: outOfPlay, to: available, count: all}
    - {type: setFlag, flag: law3175, value: true}
  unshaded:
    text: "Guard recruitment: place up to 2 Village Guards in each of up to 2 Mountain or Plain spaces with State Control and Police."
    owner: state
    tier: T0
    effects:
      - type: forEachSpace
        where:
          type: all
          of:
            - {type: terrainIn, terrain: [mountain, plain]}
            - {type: control, faction: state}
            - {type: spaceHas, pieces: [police]}
        min: 0
        max: 2
        effects: [{type: placePieces, piece: guards, count: {min: 0, max: 2}, space: selected}]
  shaded:
    text: "Recruitment under pressure and pay: State Resources -3. Shift one space with a Village Guard and no PKK Harm marker, or one Mountain space with State Control, one level toward Opposition."
    owner: pkk
    tier: T0
    effects:
      - {type: adjustTrack, track: resources.state, delta: -3}
      - type: forEachSpace
        where:
          type: any
          of:
            - {type: all, of: [{type: spaceHas, pieces: [guards]}, {type: not, of: {type: spaceHas, markers: [pkkHarm]}}]}
            - {type: all, of: [{type: terrainIn, terrain: [mountain]}, {type: control, faction: state}]}
        min: 1
        max: 1
        effects: [{type: shiftLevel, space: selected, direction: opposition, steps: 1}]
  encoding: {status: encoded, encodedBy: claude, reviewedAgainstText: true, note: "Always line from 08 s2.2 and 10 s6.1. Flag law3175 opens Guard placement (06 s2.1) and Strike Collaborators (06 s5.3). Unshaded per DEC-33, no module procedure"}
  eventConfidence: High
  deckEligible: true
  sources: [E-0004, E-0005, S-0064, S-0120, S-0241, S-0320, S-0341, S-0019, S-0020, S-0022, S-0097, S-0498, S-0501, S-0499]
