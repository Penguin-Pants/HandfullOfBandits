- id: DK-036
  campaign: C3
  title: "OHAL Powers (KHK 413, Apr 1990)"
  date: "1990-04-09"
  type: event
  unshaded:
    text: "If Emergency Rule is OHAL, set it to OHAL Extended Powers. Village Clearance is now available (DD-07.2; 07, section 8.2)."
    owner: state
    tier: T0
    effects:
      - {type: setTrack, track: emergencyRule, value: ohalExtendedPowers, ifEquals: ohal}
  shaded:
    text: "Press curbs: Legitimacy -2. Europe +1."
    owner: pkk
    tier: T0
    effects:
      - {type: adjustTrack, track: legitimacy, delta: -2}
      - {type: adjustTrack, track: europe, delta: 1}
  encoding: {status: encoded, encodedBy: "P3b-07a", reviewedAgainstText: true, note: "Village Clearance is open from C3 (switch.on.C3, 10 s6.2), so the second unshaded sentence needs no effect (DEC-68)"}
