- id: DK-080
  campaign: C5
  title: "Susurluk Commission Report (May 1997)"
  date: "1997-05-16"
  type: event
  unshaded:
    text: "Dissent notes limit the report: reveal 1 Covert marker at random. The State may then pay 1 Resource to remove 1 State Harm marker."
    owner: state
    tier: T3
    effects:
      - {type: procedure, id: covert.revealRandom}
      - type: conditional
        if: {type: trackAtLeast, track: resources.state, value: 1}
        then:
          - type: forEachSpace
            where: {type: all, of: [{type: spaceHas, markers: [stateHarm]}, {type: control, faction: state}, {type: spaceHas, pieces: [police]}]}
            min: 0
            max: 1
            effects:
              - {type: adjustTrack, track: resources.state, delta: -1}
              - {type: removeMarker, marker: stateHarm, space: selected}
  shaded:
    text: "Reveal up to 2 Covert markers at random. Then apply Guard Abuse (07, section 4.7)."
    owner: pkk
    tier: T3
    effects:
      - {type: procedure, id: covert.revealRandom}
      - type: choice
        options:
          - {label: Reveal a second Covert marker, effects: [{type: procedure, id: covert.revealRandom}]}
          - {label: Stop after one, effects: []}
      - type: forEachSpace
        all: true
        where: {type: all, of: [{type: spaceHas, pieces: [guards]}, {type: spaceHas, markers: [stateHarm, pkkHarm, disputedHarm]}]}
        effects:
          - {type: adjustTrack, track: legitimacy, delta: -1}
          - {type: removePieces, piece: guards, count: 1, space: selected}
  encoding: {status: encoded, encodedBy: "P3b-07h", reviewedAgainstText: true, note: "U: the paid removal needs State Control and Police, as Civic Action (DEC-75 point 11). S: the executor may stop after 1 reveal (DEC-75 point 1); Guard Abuse as DK-006 shaded (DEC-57)"}
  eventConfidence: Moderate
  deckEligible: true
  sources: [E-0223, E-0016, S-0147, S-0343, S-0146, S-0008, S-0010]
- id: DK-085
  campaign: C5
  title: "HADEP Congress Flag Case (1996-1997)"
  date: "1996-06"
  type: event
  unshaded:
    text: "Place the Closure Case marker if none is on the track. Legal Space to Prosecuted."
    owner: state
    executors: [state]
    tier: T0
    effects:
      - type: conditional
        if: {type: trackIn, track: legalSpace, values: [open, prosecuted]}
        then:
          - type: conditional
            if: {type: flag, flag: closureCase, value: false}
            then: [{type: setFlag, flag: closureCase, value: true}]
          - {type: setTrack, track: legalSpace, value: prosecuted}
  shaded:
    text: "Convictions draw protest: Legitimacy -1. Europe +1."
    owner: pkk
    tier: T0
    effects:
      - {type: adjustTrack, track: legitimacy, delta: -1}
      - {type: adjustTrack, track: europe, delta: 1}
