  subsections: []
- id: 03 s5
  file: 03-map-and-spaces.md
  heading: Stacking
  text: |-
    1. Maximum two Bases of each faction in a domestic space. A State Base and a PKK Base may share a space.
    2. Maximum two PKK Bases in each external box (CT 1.4.2).
    3. No PKK Base in Western Cities. No State Base in an external box.
    4. Village Guards may stack only in Mountain or Plain spaces. Maximum three Guards per space [tune].
    5. Only PKK pieces may be in Syria-Bekaa and Iran. State Troops may be in the KDP Zone or PUK Zone only through Cross-Border (DD-05).
    6. Office markers stack without limit, but the Legal Politics procedure places at most one Office per space (07, section 6).
    7. Markers do not count for stacking or Control.
  subsections: []
- id: 03 s6
  file: 03-map-and-spaces.md
  heading: Control
  text: |-
    A faction Controls a space if the number of its pieces in the space exceeds the number of the other faction's pieces (CT 1.7). Count Troops, Police, Village Guards and State Bases for the State. Count Guerrillas (Underground and Active) and PKK Bases for the PKK. Office markers never count (DD-10.2). Equal numbers or no pieces mean the space is Uncontrolled. External boxes have no Control.

    Village Guards count only in their home space (DD-06.1). Guards never move, so every Guard on the map is in its home space.

    Adjust Control after each action and after both factions finish Redeploy.
  subsections: []
- id: 03 s7
  file: 03-map-and-spaces.md
  heading: Scenario notes on Batman and Şırnak
  text: |-
    Batman and Şırnak became provinces in 1990. Before that, Batman districts belonged to Siirt and Mardin, and Şırnak districts belonged to Siirt and Mardin [L-028; L-022; Q-163; Q-164]. Cizre was in Mardin before 1990, per an unverified registry note [L-039].

    Rules:

    1. The space names stay fixed in every scenario (DD-05). Botan and Mardin-Batman name regions, not legal units.
    2. In C1 and C2 the Playbook explains that the area of Botan and Mardin-Batman belonged to the old Siirt and Mardin provinces. No rule changes.
    3. Pop stays fixed. Do not read the 1985 to 1990 change in the four provinces as migration [Q-163; Q-164].
    4. Event cards dated before 1990 that name "Siirt" or "Mardin" affect the space that holds the named place today: Eruh is in Botan [L-002], Nusaybin and Midyat are in Mardin-Batman [L-041; L-042].
    5. The emergency region list changed over time. Batman and Şırnak were added in May 1990 (one source, Low) and Mardin left in Nov 1996 [F-014; E-0219]. The game uses one national Emergency Rule track (07, section 8). Province-level changes are event effects only (DD-12.4).
  subsections: []
- id: 03 s8
  file: 03-map-and-spaces.md
  heading: Map tests
  text: |-
    1. Check that the PUK Zone link through the KDP Zone does not make PUK access useless. If the PKK never uses the PUK Zone, link it to Hakkari and record the change.
    2. Check that Diyarbakır City with one link is reachable enough. Count March and Sweep moves into it per game.
    3. Check that Western Cities with no land links still sees play. Count Rally and Train actions there.
    4. Two readers must produce the same adjacency for every space from section 4.1 alone.
  subsections: []
- id: 04 s1
  file: 04-pieces-tracks-markers.md
  heading: Scale
  text: |-
    A piece is a unit of weight, not a unit of people. Source strength figures set only the order of magnitude, and all of them have Low or Moderate confidence:

    1. State forces: about 60,000 regular gendarmerie in 1992, about 160,000 troops and gendarmerie in early 1994, about 220,000 troops by 1997 [Q-305; Q-304; Q-357].
    2. Village Guards: about 7,933 in 1985, 20,000 in Feb 1992, 45,000 in 1994, 67,000 in Jun 1995. A peak of 90,000 to 95,000 has no year [Q-184; Q-180; Q-344; Q-183; Q-186; F-048].
    3. PKK fighters: about 10,000 in 1992, 7,000 to 10,000 in late 1993, about 11,000 at peak, 1,500 inside Turkey in summer 1999 per Turkish officers [Q-297; Q-298; Q-300; Q-301].

    The inventory gives the State about twice as many pieces as the PKK. Real ratios were larger. Concealment and sanctuary balance the difference (CT 1.4.3).
  subsections: []
- id: 04 s2
  file: 04-pieces-tracks-markers.md
  heading: Piece inventory
  text: |-
    | Faction | Piece | Count | Role | Evidence and rule source |
    |---|---|---:|---|---|
    | State | Troops | 30 | Sweep, Assault, Air Mobility, Cross-Border | O-091; F-059; CT 1.4 |
    | State | Police | 24 | Gendarmerie and police. Hold Control, Garrison, needed for Civic Action and Guard placement | O-092; O-013; DD-06.4; CT 1.4 |
    | State | Village Guards | 16 | Local pieces. Count for Control in their home space. Never move | E-0004; F-010; F-011; DD-08 |
    | State | State Bases | 8 | Fixed posts. Allow Train, earn income, Redeploy destination | CT 1.4, 3.2.1, 6.2.1 |
    | PKK | Guerrillas | 30 | Underground or Active. All PKK operations | F-009; CT 1.4.3 |
    | PKK | PKK Bases | 12 | Infrastructure and camps. Income and victory (domestic only) | F-007; DD-14.3; CT 1.4 |
    | PKK | Leadership marker | 1 | Sits in Syria-Bekaa. Two sides: Present and Abroad | E-0071; F-021; DD-09.6 |

    State total 78 pieces. PKK total 42 pieces plus the Leadership marker.
  subsections:
    - 2.1 Piece rules
- id: 04 s2.1
  file: 04-pieces-tracks-markers.md
  heading: Piece rules
  text: |-
    1. Pieces enter play from Available only, unless an event says otherwise (CT 1.4.1). If a needed type is not Available, the owner may take it from the map, except Guards and pieces in external boxes.
    2. New Guerrillas are always placed Underground (CT 1.4.3). Underground Guerrillas cannot be removed by Assault (06, section 2.4).
    3. A removed piece returns to its owner's Available box. There is no Casualties box [tune]. CT uses Casualties (CT 6.5); this design drops it to cut moving parts.
    4. Village Guards start the campaign Out of Play. The Law 3175 event moves all 16 to Available [E-0004; E-0005]. Before that event, no rule or card may place a Guard (DD-08.1).
    5. A removed Guard goes to Available. It never becomes a PKK piece (DD-08.4; CT 4.3.2 Subvert rejected).
    6. Bases never move. Troops, Police and Guerrillas move by operation, special activity, Redeploy or event. Guards never move (DD-08.2).
  subsections: []
- id: 04 s3
  file: 04-pieces-tracks-markers.md
  heading: Tracks
  text: |-
    | Track | Range or steps | Start (campaign) | Moved by | Rule section |
    |---|---|---|---|---|
    | State Resources | 0 to 50 | 12 | Propaganda income, Pass +2, costs, events | 05, 06 |
    | PKK Resources | 0 to 50 | 5 | Propaganda income, Pass +1, Extort, costs, events | 05, 06 |
    | Legitimacy | 0 to 20 | 10 | Drains and gains in Propaganda, Village Clearance, Covert reveals, bans, events | 07, section 2 |
    | Emergency Rule | Martial Law, OHAL, OHAL Extended Powers, Normalizing | Martial Law | Events (OHAL, OHAL Powers), State step in Propaganda | 07, section 8 |
    | Syria posture | Host, Tolerant, Restricted, Hostile | Host | Diplomacy, Host Pressure, events, State Pivotal | 07, section 5 |
    | KDP posture | Host, Tolerant, Restricted, Hostile, Aligned with Turkey | Host | Same | 07, section 5 |
    | PUK posture | Host, Tolerant, Restricted, Hostile, Aligned with Turkey | Tolerant | Same | 07, section 5 |
    | Europe | 0 to 5 | 1 | Rally on Europe, Diplomacy, Propaganda adjustment, events, Ban marker | 07, section 9 |
    | Ceasefire | None, Declared, Reciprocal Restraint | None | PKK declaration (from C3), State acceptance, attacks, spoiler events | 07, section 7 |
    | Legal Space | Absent, Open, Prosecuted, Banned | Absent | HEP event (C3), closure case, Legal Politics procedure | 07, section 6 |
    | Campaign | C1 to C5 | C1 | Each Propaganda Reset | 05 |
    | Victory score (2 markers) | 0 to 84 | State 21, PKK 4 | Recompute after each change | 09 |
    | Harm count (2 markers) | 0 up | 0 and 0 | Recompute after each change | 09 |
  subsections:
    - 3.1 Resources
    - 3.2 Legitimacy
    - 3.3 Emergency Rule
    - 3.4 Host postures
    - 3.5 Ceasefire
    - 3.6 Europe
    - 3.7 Legal Space
- id: 04 s3.1
  file: 04-pieces-tracks-markers.md
  heading: Resources
  text: Range 0 to 50 (CT 1.8). A faction that must pay more than it has pays to 0. A faction that cannot pay an action's cost cannot take it (CT 1.8). Resources are a design currency. The research does not support an income model [Q-359 is Low and is not used].
  subsections: []
- id: 04 s3.2
  file: 04-pieces-tracks-markers.md
  heading: Legitimacy
  text: "One national State track, 0 to 20 (DD-06.3). It records domestic and international acceptance of State conduct, not support in a space. It feeds the State victory score (DD-14.2), State income (05, section 6.2) and the Civic Action spending cap (05, section 6.6). It never falls below 0 and never rises above 20. A Legitimacy loss that the track cannot pay in full costs the State 2 Resources per point not paid; if the State cannot pay, the rest is lost [tune]. Reason: at 0 the bans, breaches and reveals otherwise cost nothing (11, section 6; IR-35). Sources and drains are in 07, section 2 [M-004; M-024; F-049]."
  subsections: []
- id: 04 s3.3
  file: 04-pieces-tracks-markers.md
  heading: Emergency Rule
  text: 'Four steps, printed in this order: Martial Law, OHAL, OHAL Extended Powers, Normalizing. Each step has its own drain and unlocks (07, section 8). The track does not use "higher" and "lower" except as the table in 07 defines [M-010; F-013; E-0055].'
  subsections: []
- id: 04 s3.4
  file: 04-pieces-tracks-markers.md
  heading: Host postures
  text: Three separate tracks (DD-09.1). Syria has four steps. KDP and PUK add "Aligned with Turkey" beyond Hostile (DD-09.2). Each posture step changes PKK Rally, March, income and State Cross-Border access (07, section 5). No posture resets by itself (DD-09.4).
  subsections: []
- id: 04 s3.5
  file: 04-pieces-tracks-markers.md
  heading: Ceasefire
  text: Four steps (DD-11.1). Only the PKK moves it from None to Declared (DD-11.2). Details in 07, section 7.
  subsections: []
- id: 04 s3.6
  file: 04-pieces-tracks-markers.md
  heading: Europe
  text: |-
    Range 0 to 5. The Europe track measures diaspora resources and international pressure on both factions. It is not a Turkish political will track (CT lessons, "Two tempting borrowings to reject").

    | Europe | PKK income at Propaganda | Effect on the State |
    |---:|---:|---|
    | 0 | 0 | none |
    | 1 | 0 | none |
    | 2 | 1 | none |
    | 3 | 1 | none |
    | 4 | 2 | Legitimacy -1 at each Propaganda drain step |
    | 5 | 2 | Legitimacy -1 at each Propaganda drain step |

    Ban marker: placed by the German ban event [E-0064; Q-377] or similar events. While it is on the track, Europe cannot rise above 3 and a Rally on Europe costs 2 Resources. Evidence: F-040; M-013.
  subsections: []
- id: 04 s3.7
  file: 04-pieces-tracks-markers.md
  heading: Legal Space
  text: Absent in C1 and C2 (DD-10.1). The HEP event at the start of C3 sets it to Open [E-0007; O-030]. Closure cases move it to Prosecuted, bans move it to Banned and successors return it to Prosecuted (07, section 6) [F-015; F-052; M-007].
  subsections: []
- id: 04 s4
  file: 04-pieces-tracks-markers.md
  heading: Markers
  text: |-
    | Marker | Count | Placed by | Removed by | Effect |
    |---|---:|---|---|---|
    | Support (Active / Passive, double-sided) | 13 | Civic Action, events | Shifts, Coerce, Village Clearance | Space at Active or Passive Support |
    | Opposition (Active / Passive, double-sided) | 13 | Agitation, Rally Agitate, events | Shifts, Village Clearance, Civic Action | Space at Active or Passive Opposition |
    | State Harm | 12 | Village Clearance, revealed Covert marker, events | Civic Action Redress (3 Resources), events | Blocks shifts toward Support in its space. Counts toward State Harm count |
    | PKK Harm | 12 | Strike Collaborators, events | Agitation Redress (2 Resources), events | Blocks shifts toward Opposition in its space. Counts toward PKK Harm count |
    | Disputed Harm | 6 | Events with contested attribution, Cross-Border (07, section 4) | Events only | Counts for neither faction. 3 or more on the map drain Legitimacy 1 |
    | Coercion | 8 | Coerce | Reset (one per space), Civic Action or Agitation (1 Resource each) | Blocks shifts in both directions until removed. Counts toward PKK Harm count |
    | Displacement (New / Old, double-sided) | 10 | Village Clearance | Return (07, section 3.3) | Blocks PKK Rally, Extort and Coerce in its space. New side drains Legitimacy 1 at the next Propaganda, then flips to Old |
    | Reception | 8 | Village Clearance | Civic Action relief (1 Resource each) | Obligation in Diyarbakır City or Western Cities. 3 or more on the map drain Legitimacy 1 |
    | Covert (face-down) | 6 | Covert Action | Reveal (becomes a State Harm marker) | Hidden until revealed. All are revealed before final scoring |
    | Office | 8 | Legal Politics procedure, events | Ban, events | No Control. Caps its space at Passive Support and at Passive Opposition (DD-18.4). Changes Legitimacy rules |
    | Closure Case | 1 | State filing in Propaganda | Ban resolution | Pending case against the legal party |
    | Successor | 1 | Ban | Next Legal Politics step | Records the Office count before the ban |
    | Ban (Europe) | 1 | Events | Events | Caps Europe at 3 |
    | Restraint Broken | 2 (one per faction) | Breaking a ceasefire restriction | Reset | Records a breach this Campaign |
    | Capability | 12 (two-sided by faction) | Capability events | Rare events | Lasts the game (CT 5.3; DD-13.5) |
    | Momentum | 8 | Momentum events | Reset | Lasts to the next Reset (CT 5.4; DD-13.5) |
    | Initiative cylinders | 2 | Setup | Initiative track | Eligibility (05) |

    Harm marker sides name the faction that caused the harm or "Disputed" (DD-07.1). Card text names roles, never victims (Claude harm file, section 7).
  subsections:
    - 4.1 Support and Opposition levels
    - 4.2 Harm count
- id: 04 s4.1
  file: 04-pieces-tracks-markers.md
  heading: Support and Opposition levels
  text: |-
    Each populated domestic space is at one of five levels: Active Support, Passive Support, Neutral, Passive Opposition, Active Opposition (DD-06.2). Neutral has no marker. A shift moves one level. A shift from Passive Support toward Opposition goes to Neutral first.

    Total Support = Pop of Passive Support spaces + 2 x Pop of Active Support spaces.
    Total Opposition = Pop of Passive Opposition spaces + 2 x Pop of Active Opposition spaces.

    Maximum Total Support or Total Opposition: 2 x 32 = 64. The double count for Active levels is a design choice that follows the five-level scale in DD-06. CT uses three levels (CT 1.6).
  subsections: []
- id: 04 s4.2
  file: 04-pieces-tracks-markers.md
  heading: Harm count
  text: |-
    State Harm count = State Harm markers on the map.
    PKK Harm count = PKK Harm markers on the map + Coercion markers on the map.

    Coercion counts for the PKK because DD-14.3 puts a Harm gate on its own coercion. Disputed markers count for neither (Claude harm file, section 4, rule 7). Use in 09.
  subsections: []
- id: 04 s5
  file: 04-pieces-tracks-markers.md
  heading: "What moves each item: summary"
  text: |-
    | Item | State moves it by | PKK moves it by | Automatic |
    |---|---|---|---|
    | Support and Opposition | Train Civic Action, Propaganda Civic Action, Village Clearance (one level toward Neutral) | Rally Agitate, Propaganda Agitation, Coerce (toward Neutral only) | none |
    | Legitimacy | Village Clearance, Covert reveals, Emergency Rule step, closure ban | Ceasefire offers (indirect) | Propaganda drains and gains |
    | Emergency Rule | Step in Propaganda | none | OHAL event |
    | Host postures | Diplomacy, State Pivotal | Host Pressure | Events only |
    | Europe | Diplomacy | Rally on Europe | Propaganda harm comparison |
    | Ceasefire | Acceptance, breach | Declaration, breach | Spoiler events |
    | Legal Space and Offices | Closure case | none (DD-10.5) | Legal Politics procedure |
    | Harm, Displacement, Reception | Village Clearance, Covert, Redress, relief, Return | Strike Collaborators, Coerce, Redress | Reset removes one Coercion per space |
  subsections: []
- id: 04 s6
  file: 04-pieces-tracks-markers.md
  heading: Tests
  text: |-
    1. Count pieces left in Available at the end of each Campaign. If either side runs out of a piece type in more than one game in three, raise the count.
    2. Check that the five-level scale does not make Active levels the only goal. Compare scores with Active counted once.
    3. Check that the Harm count stays readable. Two readers must compute it alike from the board.
  subsections: []
- id: 05 s1
  file: 05-sequence-of-play.md
  heading: Game structure
  text: |-
    1. The deck has five piles, one per Campaign (C1 to C5). Each pile has 12 Event cards and one Propaganda card (DD-13.1). A Campaign is the Event cards between two Propaganda rounds (CT 2.4.1; DD-01.3).
    2. Play one card at a time. Only the current card is face up. There is no next-card preview (CT 2.2; DD-04.5).
    3. Each Event card gives both factions at most one action. A Propaganda card starts a Propaganda round (section 6).
    4. The game ends after the fifth Propaganda round or at an earlier victory check (09). A ceasefire never ends the game (07, section 7).
  subsections:
    - 1.1 Deck building
- id: 05 s1.1
  file: 05-sequence-of-play.md
  heading: Deck building
  text: |-
    Do this for each Campaign pile, C1 to C5:

    1. Take the Campaign's mandatory structural cards (10, section 6.1). C1: Law 3175 and KDP Orders PKK Out. C2: OHAL and Syria Security Protocol. C3: HEP Founded and Northern Iraq Vacuum. C4: none. C5: Capture.
    2. From that Campaign's pool of at least 14 deck-eligible cards (DD-13.2, DD-13.3), draw at random until the pile has 12 Event cards in total. Never draw research leads outside a declared playtest.
    3. Shuffle the 12 Event cards. Deal the top 8 face down and keep the bottom 4 apart.
    4. Mandatory cards must be in the top 8. If a mandatory card is in the bottom 4, swap it with the lowest non-mandatory card of the top 8 (DD-17.1). If a chain pair in 08, section 8, ends in a mandatory card, the earlier card of that pair also counts as mandatory for this step.
    5. Apply the chain order in 08, section 8, now, before the Propaganda card goes in. Swap the two cards of a pair if the later card lies above the earlier one.
    6. Shuffle the Propaganda card into the bottom 4. Put the 8 on top of these 5. The Propaganda card is now the 9th to 13th card (DD-13.1 bottom-third rule).
    7. Stack the piles with C1 on top. Set unused pool cards aside unseen (CT 10.0).

    Cards that fall below a Propaganda card are played in the next Campaign. This follows CT 10.0, where the Propaganda card is shuffled into its pile.
  subsections: []
- id: 05 s2
  file: 05-sequence-of-play.md
  heading: Initiative
  text: ""
  subsections:
    - 2.1 Initiative track
    - 2.2 Card procedure
    - 2.3 Responder matrix
    - 2.4 Adjust eligibility
- id: 05 s2.1
  file: 05-sequence-of-play.md
  heading: Initiative track
  text: "Each faction has one cylinder. The track has five boxes: Event, Limited Op, Op Only, Op + SA, Pass (CT 2.3.1, 2.3.2; DD-04.1). The PKK is First Eligible at the start of every scenario and after every Reset (CT 10.0, 6.5; DD-04.6)."
  subsections: []
- id: 05 s2.2
  file: 05-sequence-of-play.md
  heading: Card procedure
  text: |-
    1. Reveal the card.
    2. Pivotal check: either faction may play a Pivotal Event now (section 4).
    3. The First Eligible faction chooses one option and executes it fully. Place its cylinder in the matching box:
       - Event: execute the card's Event. Box: Event.
       - Limited Op: one Operation in one location, no Special Activity. Box: Limited Op.
       - Op Only: one Operation in two or more locations, no Special Activity. Box: Op Only.
       - Op + SA: one Operation in any number of locations plus one Special Activity. Box: Op + SA.
       - Pass: gain Resources (section 3.2). Box: Pass.
    4. The Second Eligible faction chooses one box from the responder matrix (section 2.3), executes it and places its cylinder.
    5. Adjust eligibility (section 2.4).
    6. Reveal the next card (CT 2.3.6).
  subsections: []
- id: 05 s2.3
  file: 05-sequence-of-play.md
  heading: Responder matrix
  text: |-
    The Second Eligible faction may choose a box adjacent to the First Eligible cylinder (CT 2.3.2). The CT rule text does not print the box layout. The cells below are labeled by source.

    | First Eligible chose | Second Eligible may choose | Source of the cell |
    |---|---|---|
    | Op + SA | Event, Limited Op, Pass | CT rule: 2.3.2 adjacency, confirmed by CT playbook worked examples |
    | Op Only | Limited Op, Pass | CT rule: 2.3.2 adjacency, confirmed by CT playbook worked examples |
    | Limited Op | Op Only, Op + SA, Pass | CT rule: 2.3.2 adjacency, confirmed by CT playbook worked examples |
    | Event | Op + SA, Pass | CT playbook worked example (twelfth card: after a Pivotal Event in the Event box, the other player may choose Op + Special Activity or Pass). The same cells follow from the symmetry of the confirmed rows |
    | Pass | Event, Limited Op, Op Only, Op + SA, Pass | Design choice. CT text gives no response after Pass except that both may Pass (CT 2.3.3). The design treats Pass as adjacent to every box |

    The derived adjacency graph is: Pass touches all four other boxes; Op + SA touches Event and Limited Op; Limited Op touches Op Only. Print this graph on the track.

    Notes:

    1. If the First Eligible took the Event, the responder can never take the same Event. A faction can block an Event only by taking it. Pass is its own box (CT 2.3.2), so a faction cannot take the Event box and then pass, as The British Way allows (BW 2.3.3).
    2. When the responder takes Op Only or Op + SA after a Limited Op, it may use any number of locations. Design choice: CT 2.3.2 says "any number of spaces" for these boxes, but the CT 2.3.5 clarification can be read as one location. This design follows 2.3.2.
    3. Declare Ceasefire (07, section 7.1) is a PKK action that uses the Limited Op box. It is legal wherever Limited Op is legal.
  subsections: []
- id: 05 s2.4
  file: 05-sequence-of-play.md
  heading: Adjust eligibility
  text: |-
    Next-card order depends on the First Eligible choice only (CT 2.3.5; DD-04.2):

    1. First Eligible chose Op Only or Op + SA: the other faction becomes First Eligible.
    2. First Eligible chose Event, Limited Op or Pass: it stays First Eligible.
    3. Both factions passed: no change (CT 2.3.3).
    4. A Pivotal Event player is First Eligible on the next card (section 4).
  subsections: []
- id: 05 s3
  file: 05-sequence-of-play.md
  heading: Limited Op and Pass
  text: ""
  subsections:
    - 3.1 Limited Op
    - 3.2 Pass
- id: 05 s3.1
  file: 05-sequence-of-play.md
  heading: Limited Op
  text: |-
    A Limited Op is one Operation in one location, with no Special Activity (CT 2.3.4).

    1. A location is one map space or one external box. The Europe track is a location for PKK Rally (CT 2.3.5 clarification; 06, section 4.1).
    2. Garrison, Sweep and March as a Limited Op may take pieces from several spaces, but all must go to one destination space (CT 2.3.4).
    3. Train with its Civic Action and Rally with its Agitate stay Limited if they select one space (CT 3.2.1, 3.3.1).
    4. A Special Activity is never allowed with a Limited Op (CT 4.1).
  subsections: []
- id: 05 s3.2
  file: 05-sequence-of-play.md
  heading: Pass
  text: A faction that passes takes no action on this card. The State gains +2 Resources. The PKK gains +1 Resource (CT 2.3.3; DD-04.4). Passing keeps the First Eligible faction First Eligible. It costs tempo only in what the faction did not do.
  subsections: []
- id: 05 s4
  file: 05-sequence-of-play.md
  heading: Pivotal Events
  text: |-
    Each faction starts the campaign with two Pivotal Event cards in hand (DD-13.4). Each short scenario lists the Pivotals that each faction holds (10).

    | Faction | Pivotal Event | Earliest Campaign | Board precondition | Effect summary | Evidence |
    |---|---|---|---|---|---|
    | State | Area Domination | C4 | Emergency Rule is OHAL Extended Powers and Total Opposition is 12 or more | Free Sweep, then free Assault, in up to 3 Mountain spaces. Village Clearance may accompany one of them at normal cost | E-0202; E-0204; F-036 |
    | State | Coercive Diplomacy on Syria | C5 | Syria posture is Tolerant or Restricted and Legitimacy is 5 or more | Syria posture to Hostile. Leadership flips to Abroad. PKK pieces in Syria-Bekaa stay but earn nothing | E-0124; E-0126; E-0127; E-0018; E-0019; F-020 |
    | PKK | ARGK Formed | C1 | 8 or more Guerrillas in domestic spaces and at least 2 domestic PKK Bases | Place up to 4 Guerrillas in spaces with PKK Bases, flip all Guerrillas in every space with a PKK Base Underground (DEC-55), PKK +3 Resources | E-0075 |
    | PKK | Serhildan | C3 | Total Opposition is 14 or more and Mardin-Batman or Botan is at Opposition (DD-19.5) | Shift up to 3 spaces with PKK pieces and no Office one level toward Opposition (Diyarbakır City may be one). Europe +1 | E-0173; E-0271; E-0272; F-035 |

    Procedure (CT 2.3.7):

    1. A faction may play a Pivotal Event only after the card is revealed and before the First Eligible faction chooses an option.
    2. The printed Campaign and board preconditions must be met.
    3. If both factions want to play one, the Second Eligible faction has priority. The First Eligible faction keeps its card.
    4. Place the Pivotal card on the current card. Execute the Pivotal instead of the current Event. The current card's Event is not available. Its "Always" line (structural cards) still applies.
    5. The Pivotal player becomes or stays First Eligible. Its cylinder goes in the Event box.
    6. The other faction may then take Op + SA or Pass. It becomes or stays Second Eligible.
    7. A played Pivotal stays in the played pile. Only one Pivotal per card.
  subsections: []
- id: 05 s5
  file: 05-sequence-of-play.md
  heading: Event execution
  text: |-
    1. Most cards are dual-use. The executing faction chooses either the unshaded or the shaded text, not both (CT 5.2). Either faction may choose either side unless the card restricts it. Exception (DD-10.5): the PKK may not execute an event side that places or resolves a Closure Case, bans the legal party, removes Offices or moves Legal Space. The non-player Office sides of DK-065, DK-067 and DK-094 stay open to either faction (08, section 6), because they run the procedure table and give no choice of space. Both sides of DK-053 also stay open to either faction: they run the 07, section 10.1 procedure and give no choice of target (DEC-68).
    2. Event text overrides rules. It cannot break stacking, place pieces that are not Available (unless it says so) or raise Resources above 50 (CT 5.1.1).
    3. Do as much of the text as you can (CT 5.1.3). The current Event wins a conflict with a lasting effect (CT 5.1.2).
    4. Free Operations and Special Activities granted by events cost no Resources and do not change eligibility. Civic Action, Agitate and Redress still cost Resources (CT 3.1.2, 5.5).
    5. Capability: place the marker on the chosen side. It lasts the game (CT 5.3; DD-13.5).
    6. Momentum: keep the card in view. It lasts until the next Reset (CT 5.4; DD-13.5).
    7. Structural cards have an "Always" line. Apply it when the card is revealed, whether or not anyone executes the Event (10, section 6.1). The Event text is an extra effect.
    8. Contested attribution: the card title is neutral and Harm goes to a Disputed marker (DD-15.4; 07, section 10).
    9. Sensitivity tiers T0 to T3 apply. No card gives points for killing (DD-13.6).
  subsections: []
- id: 05 s6
  file: 05-sequence-of-play.md
  heading: Propaganda round
  text: When a Propaganda card is revealed, carry out the phases below in this exact order. Never conduct two Propaganda rounds in a row. A second Propaganda card in a row is set aside with no round (CT 6.0). Each step lists who acts first.
  subsections:
    - 6.1 Victory phase
    - 6.2 Resources phase
    - 6.3 Upkeep phase
    - 6.4 Legitimacy and Emergency Rule phase
    - 6.5 Legal Politics phase (from C3)
    - 6.6 Civic Action and Agitation phase
    - 6.7 Redeploy phase
    - 6.8 Reset phase
- id: 05 s6.1
  file: 05-sequence-of-play.md
  heading: Victory phase
  text: Skip this phase in the first Propaganda round of any scenario (CT 6.1; DD-14.1). Otherwise compute both victory scores and Harm counts and apply 09, section 3. Count face-down Covert markers as 09, section 3, step 1 says. If a faction wins, the game ends.
  subsections: []
- id: 05 s6.2
  file: 05-sequence-of-play.md
  heading: Resources phase
  text: |-
    1. State income: 8 + (Legitimacy / 2, round down) + Pop of each Mountain or Plain space with State Control and a State Base [tune]. The Legitimacy term follows the research link between conduct and external support [E-0265]. The Base term adapts CT 6.2.1.
    2. PKK income: +1 per domestic PKK Base, +1 per PKK Base in an external box whose host is Host or Tolerant, +2 if the Leadership is Present and Syria is Host or +1 if Syria is Tolerant, plus the Europe income from 04, section 3.6 [tune]. Adapts CT 6.2.2.
    3. Maximum 50.
  subsections: []
- id: 05 s6.3
  file: 05-sequence-of-play.md
  heading: Upkeep phase
  text: |-
    1. The State pays 1 Resource per 2 Village Guards on the map, round up (DD-08.3) [tune] [Q-347].
    2. If the State cannot pay in full, it removes Guards of its choice to Available until the remaining Guards are paid for.
  subsections: []
- id: 05 s6.4
  file: 05-sequence-of-play.md
  heading: Legitimacy and Emergency Rule phase
  text: |-
    Apply in this order. Legitimacy stays between 0 and 20.

    1. Emergency Rule drain: Martial Law -1, OHAL -1, OHAL Extended Powers -2, Normalizing 0 (DD-12.3).
    2. Late cost of Village Clearance: -1 per Displacement marker on its New side. Flip each to Old.
    3. Reception: -1 if 3 or more Reception markers are on the map.
    4. Disputed harm: -1 if 3 or more Disputed Harm markers are on the map.
    5. Covert exposure: if 3 or more face-down Covert markers are on the map, the PKK picks one at random and reveals it. It becomes a State Harm marker. Legitimacy -2.
    6. Europe adjustment: Europe +1 if the State Harm count is at least 3 more than the PKK Harm count. Europe -1 if the PKK Harm count is at least 3 more than the State Harm count. Then, if Europe is 4 or 5, Legitimacy -1.
    7. Gains: +1 if Legal Space is Open and 2 or more Offices are on the map. +1 if Ceasefire is Reciprocal Restraint and the State has no Restraint Broken marker. +1 if step 2 flipped no marker.
    8. Emergency Rule step: the State may move the track one step (07, section 8.2).
  subsections: []
- id: 05 s6.5
  file: 05-sequence-of-play.md
  heading: Legal Politics phase (from C3)
  text: |-
    Skip in C1 and C2 while Legal Space is Absent.

    1. Closure filing: the State may file a closure case (07, section 6.3).
    2. Run the Legal Politics procedure table (07, section 6.4), all lines in order.
    3. Ceasefire step: resolve 07, section 7.3.
  subsections: []
- id: 05 s6.6
  file: 05-sequence-of-play.md
  heading: Civic Action and Agitation phase
  text: |-
    1. State Civic Action first, then PKK Agitation. Procedures in 07, section 1.3. Adapts CT 6.3.1 and 6.3.2.
    2. State total spending in this phase cannot exceed half of current Legitimacy, round down (CT 6.3.1 pattern, with Legitimacy in place of Commitment; halved after the desk test in 11, IR-02) [tune]. In this phase Civic Action needs State Control, Troops and Police in the space (CT 6.3.1; 07, section 1.3) [tune].
    3. Final round only: after this phase, reveal all Covert markers (each becomes a State Harm marker and costs Legitimacy 2), then end the game and score margins (09, section 4). Skip phases 6.7 and 6.8 (CT 6.3.3).
  subsections: []
- id: 05 s6.7
  file: 05-sequence-of-play.md
  heading: Redeploy phase
  text: |-
    State first. Do not adjust Control until both factions finish (CT 6.4).

    1. State: move any Troops on the map to any City or any space with a State Base. All Troops in the KDP Zone or PUK Zone must move this way. Move any Police to any State-Controlled space. Guards never move (DD-08.2).
    2. PKK: move any Guerrillas to an adjacent space or box that has a PKK Base. Movement into an external box follows posture limits (07, section 5).
    3. Adjust Control in all spaces.
  subsections: []
- id: 05 s6.8
  file: 05-sequence-of-play.md
  heading: Reset phase
  text: |-
    1. Remove one Coercion marker from each space that has any (CT 6.5).
    2. Flip all Guerrillas Underground, including those in Hostile or Aligned host boxes (CT 6.5; prototype DEC-53, designer decision 2026-10-30).
    3. Discard Momentum cards (CT 6.5).
    4. Remove Restraint Broken markers.
    5. Advance the Campaign marker. Apply the structural changes for the new Campaign (10, section 6.1).
    6. Set the PKK First Eligible (CT 6.5; DD-04.6).
    7. Reveal the next card.
  subsections: []
- id: 05 s7
  file: 05-sequence-of-play.md
  heading: End of game
  text: |-
    The game ends at the first of:

    1. A victory phase in which a faction meets its threshold and passes its Harm gate (09, section 3).
    2. The end of phase 6.6 in the final Propaganda round. Score margins (09, section 4).

    After the game, fill in the outcome record sheet (09, section 6). It is a record, not a second score (DD-14.5).
  subsections: []
- id: 05 s8
  file: 05-sequence-of-play.md
  heading: Play aid (one page)
  text: |-
    | Step | What happens | Rule |
    |---|---|---|
    | Card | Reveal. Pivotal check. First Eligible acts. Second Eligible responds from the matrix. Adjust eligibility | 2, 4 |
    | First chose Op + SA | Second: Event, Limited Op, Pass. Next card: Second becomes First | CT 2.3.2, 2.3.5 |
    | First chose Op Only | Second: Limited Op, Pass. Next card: Second becomes First | CT 2.3.2, 2.3.5 |
    | First chose Limited Op | Second: Op Only, Op + SA, Pass. First stays First | CT 2.3.2, 2.3.5 |
    | First chose Event | Second: Op + SA, Pass. First stays First | Design choice |
    | First chose Pass | Second: any box. First stays First. Both pass: no change | Design choice; CT 2.3.3 |
    | Limited Op | One location, no SA. Garrison, Sweep, March: many origins, one destination | CT 2.3.4 |
    | Pass | State +2, PKK +1 | CT 2.3.3 |
    | Pivotal | Before First chooses. Second Eligible has priority. Player goes to Event box; other may Op + SA or Pass | CT 2.3.7 |
    | P1 Victory | Skip in first round. Threshold and Harm gate | 09 |
    | P2 Resources | State 8 + Legit/2 + Pop of Controlled non-City spaces with State Base. PKK Bases + host Bases + Leadership + Europe | 6.2 |
    | P3 Upkeep | State pays 1 per 2 Guards | 6.3 |
    | P4 Legitimacy | Emergency drain, New Displacement, Reception 3+, Disputed 3+, Covert 3+, Europe, gains, Emergency step | 6.4 |
    | P5 Legal Politics | From C3: closure filing, procedure table, ceasefire step | 07 |
    | P6 Civic Action / Agitation | State (cap = Legitimacy / 2; Control, Troops and Police), then PKK. Final round: reveal Covert, score, end | 6.6 |
    | P7 Redeploy | State Troops to Cities or State Bases; Police to State Control; PKK to adjacent PKK Base | 6.7 |
    | P8 Reset | -1 Coercion per space, flip Underground, discard Momentum, next Campaign changes, PKK First Eligible | 6.8 |
  subsections: []
- id: 05 s9
  file: 05-sequence-of-play.md
  heading: Flowchart
  text: |-
    ```mermaid
    flowchart TD
        A[Reveal card] --> B{Propaganda card?}
        B -- No --> P{Pivotal played?}
        P -- Yes --> PV[Execute Pivotal. Player to Event box. Other: Op + SA or Pass]
        P -- No --> C[First Eligible: Event, Limited Op, Op Only, Op + SA or Pass]
        C --> D[Second Eligible: choose from responder matrix]
        PV --> E
        D --> E[Adjust eligibility]
        E --> A
        B -- Yes --> F{First Propaganda round?}
        F -- Yes --> R[Resources]
        F -- No --> V{Threshold met and Harm gate passed?}
        V -- Yes --> W[Game ends: winner]
        V -- No --> R
        R --> U[Upkeep]
        U --> L[Legitimacy and Emergency Rule]
        L --> LP[Legal Politics from C3 and ceasefire step]
        LP --> CA[Civic Action and Agitation]
        CA --> FR{Final round?}
        FR -- Yes --> FS[Reveal Covert markers. Score margins. Game ends]
        FR -- No --> RD[Redeploy]
        RD --> RS[Reset and next Campaign changes]
        RS --> A
    ```
  subsections: []
- id: 05 s10
  file: 05-sequence-of-play.md
  heading: Tests
  text: |-
    1. Two readers must find the same legal responses for every row of the matrix without discussion.
    2. Count initiative streaks. A streak longer than 4 cards in more than one game in three needs a fix.
    3. Count Pass choices per faction per Campaign. If the PKK passes more than half its turns, its income is too low.
  subsections: []
- id: 06 s1
  file: 06-operations-and-special-activities.md
  heading: General rules
  text: |-
    1. An Operation (Op) selects one or more locations and pays its cost per location, unless the text says "total".
    2. A Special Activity (SA) needs an Op + SA choice. It accompanies only the Ops listed for it. One SA per action. Never with a Limited Op (CT 4.1).
    3. An SA may happen before, during or after its Op, unless the text says otherwise. It may select spaces that the Op did not select, unless the text says otherwise.
    4. A faction that cannot pay the full cost of a location cannot select it (CT 1.8).
    5. Detection before destruction: Underground Guerrillas are never removed by Assault, Air Mobility or Cross-Border Assault. They must be Activated first by Sweep, Garrison, Village Clearance, PKK actions or events (CT 1.4.3, 3.2.4). Covert Action is the one exception and carries a hidden cost.
    6. Mountain modifier: in Mountain spaces, KDP Zone and PUK Zone, activation is one Guerrilla per 2 eligible State pieces and Assault is one removal per 2 Troops, round down (CT 3.2.2 to 3.2.4).
    7. No action gives victory points for removing pieces. Removing a PKK Base lowers the PKK score because the Base no longer exists. It never adds to the State score (DD-07.4; M-028).
    8. Ceasefire restrictions are in 07, section 7. An action that a ceasefire forbids may still be taken. It breaks the ceasefire with the costs in 07.
  subsections: []
- id: 06 s2
  file: 06-operations-and-special-activities.md
  heading: State Operations
  text: ""
  subsections:
    - 2.1 Train (recruit and train)
    - 2.2 Garrison
    - 2.3 Sweep
    - 2.4 Assault
- id: 06 s2.1
  file: 06-operations-and-special-activities.md
  heading: Train (recruit and train)
  text: |-
    Cost: 2 Resources per selected space.

    Select any of:

    1. A City (Diyarbakır City, Western Cities) or a space with a State Base: place up to 3 Troops and Police, in any mix, from Available.
    2. After the Law 3175 event: a Mountain or Plain space with State Control and at least 1 Police: place up to 2 Village Guards from Available. Maximum 3 Guards in a space.
    3. A Mountain or Plain space with State Control, at least 2 Police and fewer than 2 State Bases: replace 2 Police with 1 State Base.

    A space may use only one of the three options per Train.

    Civic Action: in one selected space, even in a Limited Op, the State may pay for Civic Action as in 07, section 1.3. The space needs State Control and Police. Civic Action costs Resources even when Train is free (CT 3.2.1).

    Evidence: Guards only after Law 3175, adopted 26 Mar 1985 and published 4 Apr 1985 [E-0004; E-0005; F-010]. Recruitment under pressure and pay [F-011; Q-347]. Supervision by gendarmerie, shown by the Police requirement [O-092; O-010]. Adapts CT 3.2.1 (Train, Pacify).
  subsections: []
- id: 06 s2.2
  file: 06-operations-and-special-activities.md
  heading: Garrison
  text: |-
    Cost: 2 Resources total.

    1. Move up to 6 Police from any domestic spaces to any domestic spaces, except into or out of Western Cities.
    2. Then select one space with Police. Activate one Underground Guerrilla there per Police plus Village Guard in that space. In a Mountain space, one per 2, round down.
    3. Limited Op: all moved Police go to one destination. Activation happens there.

    Evidence: area presence and local knowledge; Guards add to detection, not to Assault [F-012; F-034; F-049]. Adapts CT 3.2.2.
  subsections: []
- id: 06 s2.3
  file: 06-operations-and-special-activities.md
  heading: Sweep
  text: |-
    Cost: 2 Resources per selected space. At OHAL Extended Powers: 1 Resource per space [tune].

    1. Select domestic spaces other than Western Cities. (KDP Zone and PUK Zone only through Cross-Border, section 3.2.)
    2. Move any Troops from adjacent spaces into each selected space. Troops move one step only. Police and Guards do not move.
    3. In each selected space, Activate one Underground Guerrilla per Troop, Police and Guard there. In a Mountain space, one per 2, round down.
    4. Limited Op: one selected space; Troops may come from several adjacent spaces.

    Evidence: area domination and large deployments [E-0202; E-0204; Q-341; F-036]. Emergency governor powers reduce friction [E-0058; F-013]. Adapts CT 3.2.3.
  subsections: []
- id: 06 s2.4
  file: 06-operations-and-special-activities.md
  heading: Assault
  text: |-
    Cost: 2 Resources per selected space.

    1. Select spaces with Troops and Active PKK pieces. (KDP Zone and PUK Zone only through Cross-Border.)
    2. Remove one PKK piece per Troop. In a Mountain space, one per 2 Troops, round down. In a City, Police count as Troops.
    3. Remove Active Guerrillas first. Remove PKK Bases only when no Guerrillas, Underground or Active, remain in the space. Never remove Underground Guerrillas.
    4. Removed pieces go to PKK Available.

    Evidence: State military advantage limited by concealment; camps rebuilt after operations [F-049; F-059]. Adapts CT 3.2.4. CT gives +1 Commitment per Base removed; this design gives nothing (DD-07.4).
  subsections: []
- id: 06 s3
  file: 06-operations-and-special-activities.md
  heading: State Special Activities
  text: ""
  subsections:
    - 3.1 Air Mobility
    - 3.2 Cross-Border
    - 3.3 Diplomacy
    - 3.4 Village Clearance
    - 3.5 Covert Action
- id: 06 s3.1
  file: 06-operations-and-special-activities.md
  heading: Air Mobility
  text: |-
    Accompanies: any Op.

    Move up to 4 Troops among up to 3 domestic spaces, including Western Cities. The 3 spaces include origins and destinations (CT 4.2.2 pattern). Never into an external box.

    Evidence: helicopter and commando mobility in large operations [O-063; F-059]. Adapts CT 4.2.2 (Troop Lift).
  subsections: []
- id: 06 s3.2
  file: 06-operations-and-special-activities.md
  heading: Cross-Border
  text: |-
    Accompanies: Sweep or Assault.

    Access:

    1. KDP Zone: legal if KDP posture is Restricted, Hostile or Aligned with Turkey.
    2. PUK Zone: legal if PUK posture is Restricted, Hostile or Aligned with Turkey and KDP posture is also one of these.
    3. Hot pursuit, C1 and C2 only: the KDP Zone is legal at any KDP posture, with at most 3 Troops [E-0154; Q-380; F-024 is Low].
    4. From C3, after the Northern Iraq Vacuum card: also legal at Tolerant [F-023; E-0176].
    5. Never Syria-Bekaa or Iran.

    Procedure:

    1. Pay 2 Resources in addition to the Op cost. Pay 0 extra if the target host is Aligned with Turkey [tune].
    2. Move up to 6 Troops from Hakkari or Botan into the zone. For the PUK Zone, Troops may pass through the KDP Zone in this move.
    3. Conduct the Sweep or Assault in the zone as one selected location. The zone is Mountain terrain. If the host is Aligned with Turkey, ignore the Mountain modifier for Assault (local allied forces) [E-0082].
    4. If the Assault removes at least one PKK piece and the zone has no Disputed Harm marker, place one. Civilian harm in these operations is not verified in the research. The marker records "unknown", not "none".
    5. State Troops stay in the zone until the next Redeploy phase. They give no Control.

    Evidence: operations in Aug 1991, Oct 1992, Mar to May 1995, May to Jul 1997 and Sep to Oct 1997 [E-0077; E-0083; E-0108; E-0120; F-059; Q-342]. Adapts CT 1.3.4 and 5.1.8 (no entry to Countries) with a restricted-entry exception.
  subsections: []
- id: 06 s3.3
  file: 06-operations-and-special-activities.md
  heading: Diplomacy
  text: |-
    Accompanies: any Op.

    1. Pay 2 Resources.
    2. Choose one target: Syria posture, KDP posture, PUK posture or the Europe track.
    3. Roll one die. Modifiers: +1 if Legitimacy is 12 or more; -1 if Legitimacy is 5 or less; -1 for Syria before C5; +1 for KDP from C3.
    4. Modified 5 or more: shift the posture one step toward Hostile, or lower Europe by 1. A shift from Hostile to Aligned with Turkey needs a modified 6 or more.
    5. Otherwise no effect. Diplomacy never moves two hosts.

    Evidence: different instruments per host [F-056]. Syria yielded to force, KDP turned for revenue and alignment [F-051; F-020; F-022]. No automatic reset (DD-09.4). Original design; posture tracks adapt ADP 6.6.1 without its reset.
  subsections: []
- id: 06 s3.4
  file: 06-operations-and-special-activities.md
  heading: Village Clearance
  text: |-
    Accompanies: Sweep or Garrison.

    Conditions, all required:

    1. Emergency Rule is OHAL or OHAL Extended Powers.
    2. The OHAL Powers event has been played, or it is C3 or later (DD-07.2).
    3. The target is one Mountain or Plain space selected for the Op. It has State Control, Troops and Police. It is Neutral or Opposition. It has no Displacement marker.
    4. Legitimacy is at least (2 x target Pop) + 1.

    Effects, in order:

    1. Shift the space one level toward Neutral (DD-18.3).
    2. Legitimacy -2 x Pop of the space, at once.
    3. Place a Displacement marker, New side up. It costs Legitimacy 1 more at the next Propaganda round (05, section 6.4).
    4. Place a State Harm marker.
    5. Place a Reception marker in Diyarbakır City or Western Cities, State choice. If none is available, Legitimacy -1 instead.
    6. Activate all Guerrillas in the space.
    7. If the space holds an Office, Legitimacy -1 more.

    The space keeps its Pop for victory (DD-07.3). While the Displacement marker stays, the PKK cannot Rally, Extort or Coerce there.

    Evidence: mass evacuation in 1992-95 as a main tool, with no written order found [F-031 is Low; E-0200; Q-265; E-0204]. Contested totals [F-032; Q-273; Q-279]. Early logistics gain, later cost [F-050; M-005]. Adapts CT 4.2.1 (Resettle) but rejects its Pop 0 rule (CT lessons).
  subsections: []
- id: 06 s3.5
  file: 06-operations-and-special-activities.md
  heading: Covert Action
  text: |-
    Accompanies: Garrison or Sweep. Available from C3. Needs Legitimacy 4 or more.

    1. Select one space with State Control, Police and at least one Underground Guerrilla.
    2. Remove one Underground Guerrilla. No activation is needed.
    3. Place one face-down Covert marker in the space. If no Covert marker is available, Covert Action is not allowed.
    4. Covert Action never targets an Office or any non-player marker.

    A Covert marker is revealed by events, by the exposure step (05, section 6.4) or before final scoring. When revealed, it becomes a State Harm marker and Legitimacy -2.

    Evidence: covert networks found in part by courts and commissions [F-028; E-0015]; unidentified murders 1991 to 1994 with no attribution in the data [F-029]; late reports [F-030]; M-009. Evidence level: alleged; print it on the aid. Original design; no CT analogue.
  subsections: []
- id: 06 s4
  file: 06-operations-and-special-activities.md
  heading: PKK Operations
  text: ""
  subsections:
    - 4.1 Rally
    - 4.2 March
    - 4.3 Attack
    - 4.4 Coerce
- id: 06 s4.1
  file: 06-operations-and-special-activities.md
  heading: Rally
  text: |-
    Cost: 1 Resource per selected location.

    Locations:

    1. Any domestic space without a Displacement marker. A City only if it is Neutral or Opposition, except that Western Cities may also be selected at Passive Support or Active Support (03, section 2.1) [tune].
    2. An external box whose host posture permits (07, section 5).
    3. The Europe track: Europe +1. With the Ban marker, the cost is 2 and Europe cannot rise above 3.

    In each selected space or box:

    1. Place 1 Guerrilla from Available, or
    2. Replace 2 Guerrillas with 1 PKK Base (stacking limits apply; never in Western Cities; external Bases only where the host is Host, or Tolerant in the KDP Zone and PUK Zone after the Northern Iraq Vacuum card (07, section 5.1)), or
    3. If a PKK Base is there: place Guerrillas up to Pop + PKK Bases there (an external box counts Pop 1), or
    4. Flip all Guerrillas there Underground. No PKK Base is required.

    Agitate: in one selected space with a PKK Base or PKK Control, even in a Limited Op, the PKK may pay for Agitation as in 07, section 1.3. Agitate costs Resources even when Rally is free.

    Evidence: sanctuary and recruitment [F-007; F-051]; Europe as diaspora source [F-040; M-013]; Offices cap Agitation at Passive Opposition (DD-18.4). Adapts CT 3.3.1, with the Europe track in the role of the France Track.
  subsections: []
- id: 06 s4.2
  file: 06-operations-and-special-activities.md
  heading: March
  text: |-
    Cost: 1 Resource per destination.

    1. Move any Guerrillas from adjacent spaces or boxes into each destination. One step only.
    2. Entry into an external box: Host or Tolerant, normal; Restricted, pay 1 more Resource and the group Activates; Hostile or Aligned with Turkey, not allowed. Leaving a box is always allowed.
    3. No March into or out of Western Cities.
    4. Activation: a moving group flips Active if (the destination is at Support, or the group crosses into or out of an external box) and (group size + State pieces in the destination) is more than 3.
    5. Limited Op: one destination.

    Evidence: movement between sanctuary and mountain spaces [F-007; F-023]; host limits [F-022]. Adapts CT 3.3.2.
  subsections: []
- id: 06 s4.3
  file: 06-operations-and-special-activities.md
  heading: Attack
  text: |-
    Cost: 1 Resource per selected space.

    1. Select spaces with Guerrillas and State pieces.
    2. Activate all Guerrillas there.
    3. Roll one die. If the result is less than or equal to the number of PKK Guerrillas in the space, remove up to 2 State pieces: Troops or Police first (PKK choice), then Village Guards, then State Bases.
    4. Attrition (DD-21): if the Attack removes Troops, compare the same die result with the number of Troops present before the Attack. If the result is less than or equal to that count, remove one Guerrilla for each Troop removed. If the result is greater than that count, or no Troops were removed, no attrition occurs. Return removed Guerrillas to Available. Do not roll again.
    5. After attrition, on a roll of 1, also place 1 Underground Guerrilla from Available in the space.
    6. Removed State pieces go to State Available.

    Evidence: attacks on army patrols and stations [E-0003; E-0073; F-009]. Adapts CT 3.3.3. DD-21 replaces automatic attrition with the same die compared against the pre-Attack Troop count; this is an approved game abstraction, not a historically calibrated casualty ratio.
  subsections: []
- id: 06 s4.4
  file: 06-operations-and-special-activities.md
  heading: Coerce
  text: |-
    Cost: 1 Resource per selected space, 2 in a space with Pop 3 or more [tune] (DD-19.4).

    1. Select spaces with an Underground Guerrilla that are Neutral or Support and have no Displacement marker.
    2. Activate one Guerrilla in each.
    3. If the space has no Coercion marker, place one. If it was at Support, shift it one level toward Neutral.
    4. Coerce never shifts a space toward Opposition (DD-06.5).

    Coercion markers count toward the PKK Harm count (04, section 4.2).

    Evidence: both armed sides pressed the same villages; compliance is not support [F-034; F-012]. Adapts CT 3.3.4 (Terror), with a one-level shift in place of "set to Neutral" to fit the five-level scale.
  subsections: []
- id: 06 s5
  file: 06-operations-and-special-activities.md
  heading: PKK Special Activities
  text: ""
  subsections:
    - 5.1 Ambush
    - 5.2 Extort
    - 5.3 Strike Collaborators
    - 5.4 Host Pressure
- id: 06 s5.1
  file: 06-operations-and-special-activities.md
  heading: Ambush
  text: |-
    Accompanies: Attack.

    In up to 2 Attack spaces that have an Underground Guerrilla: do not roll. Activate only one Underground Guerrilla. Remove 1 State piece in the Attack order. No attrition.

    Evidence: guerrilla tactics against patrols [E-0162]. Adapts CT 4.3.3.
  subsections: []
- id: 06 s5.2
  file: 06-operations-and-special-activities.md
  heading: Extort
  text: |-
    Accompanies: any Op.

    In each space with Pop 1 or more, an Underground Guerrilla, PKK Control and no Displacement marker, and in each external box whose host is Host or Tolerant and that holds an Underground Guerrilla: Activate one Guerrilla and gain 1 Resource.

    Evidence: taxation mixed willing and coerced payment; Low confidence [F-034; Q-359 not used for values]. Adapts CT 4.3.1.
  subsections: []
- id: 06 s5.3
  file: 06-operations-and-special-activities.md
  heading: Strike Collaborators
  text: |-
    Accompanies: Rally, March or Coerce. Needs the Law 3175 event.

    1. Select up to 2 spaces with an Underground Guerrilla and at least one Village Guard. Pay 1 Resource per space.
    2. Remove up to 2 Guards in total to State Available.
    3. Activate one Guerrilla in each selected space.
    4. Place a PKK Harm marker in each selected space.
    5. Europe -1, once per action.

    Strike Collaborators never shifts Support or Opposition. Its gain is military only. A removed Guard never becomes a PKK piece (DD-08.4).

    Evidence: guards were the PKK's main local target; attacks also hit families and teachers [F-012; F-034; E-0169]. Cost in European space [F-040]. Rejects CT 4.3.2 (Subvert) per CT lessons.
  subsections: []
- id: 06 s5.4
  file: 06-operations-and-special-activities.md
  heading: Host Pressure
  text: |-
    Accompanies: Rally or March.

    1. Select one host (Syria, KDP or PUK) whose box holds a PKK piece. Not Syria while the Leadership is Abroad.
    2. Pay 2 Resources. Roll one die.
    3. Syria or PUK: 4 to 6, shift one step toward Host; 1, shift one step toward Hostile (backfire); 2 to 3, no effect.
    4. KDP: 5 to 6, shift one step toward Host; 1 to 2, shift one step toward Hostile (backfire); 3 to 4, no effect.
    5. If Host Pressure before Rally or March makes planned locations illegal, retain the roll and paid SA cost. The PKK chooses new legal locations for the same Operation before resolution continues (DEC-54; DEC-56).

    Evidence: the 1992 attempt to force host tolerance turned the KDP and PUK against the PKK [F-041 is Low; E-0080; E-0082]; host interests governed sanctuary [F-051]. Original design using the ADP 6.6.1 posture idea.

    Europe mobilization is not a separate SA. The PKK raises Europe by selecting the Europe track as a Rally location (section 4.1). This keeps one route, as CT does with the France Track (CT 3.3.1).
  subsections: []
- id: 06 s6
  file: 06-operations-and-special-activities.md
  heading: Action summary table
  text: |-
    | Faction | Action | Type | Cost | Key limit |
    |---|---|---|---|---|
    | State | Train | Op | 2 per space | Cities or State Base; Guards need Law 3175, Control and Police |
    | State | Garrison | Op | 2 total | Up to 6 Police; activation in one space |
    | State | Sweep | Op | 2 per space (1 at OHAL Extended Powers) | Adjacent Troops, one step |
    | State | Assault | Op | 2 per space | Active pieces only; Bases last |
    | State | Air Mobility | SA, any Op | 0 | 4 Troops, 3 spaces |
    | State | Cross-Border | SA, Sweep or Assault | +2 | Host posture access |
    | State | Diplomacy | SA, any Op | 2 | Die roll, one target |
    | State | Village Clearance | SA, Sweep or Garrison | Legitimacy 2 x Pop | OHAL steps; C3 or OHAL Powers |
    | State | Covert Action | SA, Garrison or Sweep | Hidden Legitimacy 2 | From C3; Legitimacy 4+ |
    | PKK | Rally | Op | 1 per location | No Displacement; Europe track |
    | PKK | March | Op | 1 per destination | Posture; no Western Cities |
    | PKK | Attack | Op | 1 per space | One die; conditional attrition per Troop (DD-21) |
    | PKK | Coerce | Op | 1 per space | Toward Neutral only; marker |
    | PKK | Ambush | SA, Attack | 0 | 2 spaces; remove 1 |
    | PKK | Extort | SA, any Op | 0 | +1 per space with Control |
    | PKK | Strike Collaborators | SA, Rally, March or Coerce | 1 per space | Harm marker; Europe -1 |
    | PKK | Host Pressure | SA, Rally or March | 2 | Die; may backfire |
  subsections: []
- id: 06 s7
  file: 06-operations-and-special-activities.md
  heading: Worked example
  text: "The State has 10 Resources. Botan (Mountain) holds 4 Troops, 1 Police, 2 Guards and 2 Underground Guerrillas. The State chooses Op + SA: Sweep in Botan (2 Resources). It Activates (4 + 1 + 2) / 2 = 3, round down, so both Guerrillas flip Active. As its SA it takes Air Mobility and moves 2 more Troops into Botan. It cannot Assault on the same action, because Sweep was its Op. Next card the PKK is First Eligible (CT 2.3.5). The PKK may March the Active Guerrillas out, or Rally to flip them Underground without a PKK Base. Coverage and tempo compete, as in CT lessons example 1."
  subsections: []
- id: 06 s8
  file: 06-operations-and-special-activities.md
  heading: Tests
  text: |-
    1. Atrocity test (Claude harm file, section 6): for Village Clearance, Covert Action and Strike Collaborators, compute the net score change for the user at the next victory check. 09, section 7 gives the arithmetic. Any of these with a positive net score effect fails. Coerce is intimidation, not killing. It may shift a score (DD-06.5; CT 3.3.4) but its markers count toward the PKK Harm gate. 09, section 7 checks that bound.
    2. Check that Cross-Border cannot end the game by itself. Count PKK Bases rebuilt in the KDP Zone within one Campaign.
    3. Check Diplomacy odds. If a posture moves more than twice per Campaign by Diplomacy, raise the target to 6.
  subsections: []
- id: 07 s1
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Support and Opposition
  text: ""
  subsections:
    - 1.1 Principle
    - 1.2 Levels and shifts
    - 1.3 Civic Action and Agitation procedures
- id: 07 s1.1
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Principle
  text: Control, Support and Legitimacy are separate (DD-06; M-004). Control comes from pieces. Support and Opposition are per space. Legitimacy is national. No operation turns Control into Support. Support and Opposition abstract active minorities and mixed attitudes. They do not measure ethnic preference (CT playbook pp.13-14; F-034; F-049).
  subsections: []
- id: 07 s1.2
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Levels and shifts
  text: |-
    Each populated domestic space is at Active Support, Passive Support, Neutral, Passive Opposition or Active Opposition (04, section 4.1). A shift moves one level. Blocks:

    1. A Coercion marker blocks all shifts in its space until it is removed.
    2. A State Harm marker blocks shifts toward Support in its space.
    3. A PKK Harm marker blocks shifts toward Opposition in its space.
    4. An Office caps its space at Passive Support and at Passive Opposition (DD-18.4). The cap stops shifts beyond these levels. The procedure table never places an Office in a space at an Active level (section 6.4, line 4). The legal party is an independent alternative that neither armed side owns (DD-10.5).
    5. Coerce and Strike Collaborators never shift a space toward Opposition (DD-06.5).
  subsections: []
- id: 07 s1.3
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Civic Action and Agitation procedures
  text: |-
    Civic Action (State). Used in Train (one space) and in the Propaganda phase (any number of spaces, total spending at most half of Legitimacy, round down [tune]; halved after the desk test in 11, IR-02). The space needs State Control and at least one Police (DD-06.4). In the Propaganda phase it also needs at least one Troop, as CT 6.3.1 requires Troops and Police [tune]. Reason: fidelity to CT 6.3.1. It does not by itself fix the State scoring pace found in the Stage 0 desk test (11, section 1). Costs, in any order the State chooses, except that a shift needs the blocks removed first:

    | Step | Cost |
    |---|---|
    | Remove one Coercion marker | 1 |
    | Relief: remove one Reception marker | 1 |
    | Redress: remove one State Harm marker | 3 |
    | Return: remove one Displacement marker (section 3.3) | 3 |
    | Shift one level toward Support (maximum 2 shifts per space per phase or action) | 2 |

    Agitation (PKK). Used in Rally (one space with a PKK Base or PKK Control) and in the Propaganda phase (spaces with a PKK piece and no State Control). In a space with an Office, Agitation may not shift the space beyond Passive Opposition (DD-18.4).

    | Step | Cost |
    |---|---|
    | Remove one Coercion marker | 1 |
    | Redress: remove one PKK Harm marker | 2 |
    | Shift one level toward Opposition (maximum 2 shifts per space per phase or action) | 1 |

    Evidence: pacification needs capacity and spending, and spending must not buy consent by itself (CT lessons table). Adapts CT 3.2.1, 3.3.1, 6.3.1 and 6.3.2. The cost gap (State 2, PKK 1) follows CT.
  subsections: []
- id: 07 s2
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Legitimacy
  text: |-
    One national track, 0 to 20 (DD-06.3).

    | Change | When | Amount | Evidence |
    |---|---|---|---|
    | Emergency Rule drain | Propaganda | Martial Law -1, OHAL -1, OHAL Extended Powers -2, Normalizing 0 | F-013; F-055; M-010 |
    | Village Clearance | At once | -2 x Pop | F-050; M-005 |
    | Village Clearance late cost | Next Propaganda | -1 per New Displacement marker | F-050; F-043 |
    | Village Clearance in a space with an Office | At once | -1 | DD-10.5 |
    | Covert marker revealed | On reveal | -2 | F-028; F-030; M-009 |
    | Reception markers 3 or more | Propaganda | -1 | M-018; F-032 |
    | Disputed Harm markers 3 or more | Propaganda | -1 | F-029; F-058 |
    | Europe at 4 or 5 | Propaganda | -1 | F-042; M-024 |
    | Party ban | Legal Politics | -2 | F-015; F-017; M-007 |
    | State breaks Reciprocal Restraint | At once | -2 | F-039 |
    | Step Normalizing to OHAL | Propaganda | -1 | F-055 |
    | Open Legal Space and 2+ Offices | Propaganda | +1 | F-052 |
    | Reciprocal Restraint kept by the State | Propaganda | +1 | F-039 |
    | No New Displacement marker flipped this round | Propaganda | +1 | Claude restraint step |
    | Events | Card | As printed | F-042; F-043; M-024; M-025 |

    Legitimacy feeds the State score, State income and the Civic Action cap. It is the main brake on State coercion. Court and EU effects come by event and arrive late, as in history [F-043; E-0211; M-025].
  subsections: []
- id: 07 s3
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Harm and displacement (DD-07)
  text: ""
  subsections:
    - 3.1 Harm markers
    - 3.2 Displacement and Reception
    - 3.3 Return
- id: 07 s3.1
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Harm markers
  text: |-
    1. A Harm marker records civilian harm in a space. Its side names the State, the PKK or "Disputed" (DD-07.1).
    2. Sources: Village Clearance (State), revealed Covert marker (State), Strike Collaborators (PKK), Cross-Border Assault (Disputed, zone only), events (as printed; Disputed when attribution is contested).
    3. A Harm marker stays until Redress or an event removes it. It never leaves by itself.
    4. Equal costs do not claim equal acts (DD-15.3). Card text prints the evidence level.
    5. Harm markers in external boxes count for the Harm count but do not block shifts (boxes have no Support).
  subsections: []
- id: 07 s3.2
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Displacement and Reception
  text: |-
    1. Village Clearance places one Displacement marker (New side) in the cleared space and one Reception marker in Diyarbakır City or Western Cities (06, section 3.4).
    2. Displacement never lowers Pop for victory (DD-07.3). The CT Resettle Pop 0 rule is rejected (CT 4.2.1; CT lessons).
    3. While a Displacement marker is present: the PKK cannot Rally, Extort or Coerce in the space. That is the State's gain: cut logistics [F-050; F-031].
    4. The displaced space stays an obligation. It keeps the level that Village Clearance left (one level toward Neutral, DD-18.3) and scores at that level.
    5. A Reception marker is a receiving-city obligation. The State must pay relief (1 each) before it can shift that space toward Support. Reception never places a PKK piece or an Office (Sol political systems file; M-018).
    6. No victory condition counts displacement as a positive (DD-07.4).
  subsections: []
- id: 07 s3.3
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Return
  text: "Return removes one Displacement marker for 3 Resources by Civic Action. It is legal only in C5, at Normalizing, or by a Return event [E-0136]. It never removes the Harm marker in the space and gives no Support. Return was small in history: 26,481 returnees by end 1999 per government figures [Q-281]. Displacement totals stay contested [F-032]."
  subsections: []
- id: 07 s4
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Village Guards (DD-08)
  text: |-
    1. Guards enter play only after the Law 3175 event [E-0004; E-0005; F-010].
    2. Placement: Train in a Mountain or Plain space with State Control and Police (06, section 2.1).
    3. A Guard stays in its home space. It counts for Control there. It never moves by Sweep, Air Mobility, Garrison or Redeploy (DD-08.2).
    4. Guards add to Sweep and Garrison activation in their space (local knowledge). They do not add to Assault.
    5. Upkeep: 1 Resource per 2 Guards each Propaganda round (DD-08.3) [Q-347].
    6. Removal: PKK Attack (after Troops and Police), Strike Collaborators (with a PKK Harm marker), upkeep failure, events. A removed Guard never becomes a PKK piece (DD-08.4).
    7. Guard Abuse events: when such a card is executed, in every space where a Guard shares a space with any Harm marker, Legitimacy -1 and remove one Guard there, once per qualifying space (DEC-57). Card text says "some guards", not a share [F-012; Q-193 is Low].
    8. Guards have no victory score and no independent aim [F-057].
  subsections: []
- id: 07 s5
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Host postures (DD-09)
  text: ""
  subsections:
    - 5.1 Posture effects
    - 5.2 Rules
- id: 07 s5.1
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Posture effects
  text: |-
    | Posture | PKK Rally in the box | PKK March into the box | PKK income per Base in the box | State Cross-Border |
    |---|---|---|---|---|
    | Host | Guerrillas or Bases | Normal | +1 | Not allowed |
    | Tolerant | Guerrillas only (KDP and PUK: Bases too after Northern Iraq Vacuum) | Normal | +1 | Not allowed (allowed after Northern Iraq Vacuum) |
    | Restricted | None | +1 Resource; group Activates | 0 | Allowed (KDP and PUK) |
    | Hostile | None | Not allowed. Guerrillas in the box are Active, except that Reset flips them Underground (prototype DEC-53) | 0 | Allowed (KDP and PUK) |
    | Aligned with Turkey (KDP, PUK) | None | Not allowed. Guerrillas Active, except that Reset flips them Underground (prototype DEC-53) | 0 | Allowed, no extra cost; no Mountain modifier for Assault |

    Syria-Bekaa never allows Cross-Border. The C1 and C2 hot pursuit exception for the KDP Zone is in 06, section 3.2.
  subsections: []
- id: 07 s5.2
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Rules
  text: |-
    1. Each posture moves on its own. Closing one never moves another (DD-09.1).
    2. Moves: State Diplomacy (06, section 3.3), PKK Host Pressure (06, section 5.4), events, State Pivotal "Coercive Diplomacy on Syria". No automatic reset (DD-09.4; ADP 6.6.1 reset rejected).
    3. A posture change never removes pieces. It suspends Rally and income (DD-09.5).
    4. Leadership: the marker sits in Syria-Bekaa on its Present side. When Syria reaches Hostile, flip it to Abroad. While Abroad it gives no income and Host Pressure on Syria is not allowed. Capture is an event effect only, on the mandatory C5 Capture card, and applies only if the Leadership is Abroad (DD-09.6) [E-0018; E-0130; E-0020; F-021].
    5. After Capture: remove the Leadership marker. PKK income -1 per Propaganda for the rest of the game [tune]. The PKK keeps its pieces. Capture does not end the game (CT lessons; F-021; F-045).

    Evidence: Syria phases [F-020; E-0170; E-0078; E-0062]; KDP order of 1985, Oct 1992 attack, later alignment [E-0160; E-0082; F-022]; PUK as the more tolerant host [F-022]; host interests [F-051]. Iran stays event-only [F-025; E-0166].
  subsections: []
- id: 07 s6
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Legal Politics (DD-10)
  text: ""
  subsections:
    - 6.1 Scope
    - 6.2 What Offices do
    - 6.3 Closure filing
    - 6.4 Procedure table
- id: 07 s6.1
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Scope
  text: Legal Politics is a non-player system. It switches on in C3 with the HEP Founded card [E-0007; O-030]. In C1 and C2 Legal Space is Absent and this section does nothing. The rule set revises the Claude two-faction table (Claude scenarios file, section 3.4).
  subsections: []
- id: 07 s6.2
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: What Offices do
  text: |-
    1. Offices sit in domestic spaces. They give no Control and are not PKK pieces (DD-10.2).
    2. Agitation in their space may not go beyond Passive Opposition (DD-18.4).
    3. They cap their space at Passive Support and at Passive Opposition (DD-18.4).
    4. They add to neither victory score (DD-10.5).
    5. They change Legitimacy: +1 at Propaganda if Legal Space is Open and 2 or more Offices are on the map; -1 extra for Village Clearance in an Office space; -2 for a ban.
    6. The PKK cannot move Legal Space or Offices (DD-10.5). No PKK action reads or changes them. The game does not decide whether the parties acted independently of the PKK [F-018].
  subsections: []
- id: 07 s6.3
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Closure filing
  text: |-
    In the Legal Politics phase, before the procedure table, the State may file a closure case if Legal Space is Open or Prosecuted, at least one Office is on the map and no Closure Case marker is on the track. Place the Closure Case marker. Set Legal Space to Prosecuted. The case resolves at the next Propaganda round, line 1 below. Filing itself costs nothing (DD-10.4 puts the cost on the ban). An event that places the Closure Case marker also sets Legal Space to Prosecuted, as a filing does. Only the State executes such an event side (05, section 5.1).

    The State's reason to file: Offices cap Diyarbakır City and Western Cities at Passive Support (and at Passive Opposition). The cost: Legitimacy -2 and Europe +1 at the ban, and loss of the Open-Space Legitimacy gain.
  subsections: []
- id: 07 s6.4
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Procedure table
  text: |-
    Run lines 1 to 6 in order in each Legal Politics phase from C3.

    | Line | Condition | Action |
    |---|---|---|
    | 1 | A Closure Case marker was on the track at the start of this phase | Ban: Legal Space to Banned. Place the Successor marker at the number of Offices on the map. Remove all Offices. Legitimacy -2. Europe +1. Remove the Closure Case marker. Stop. |
    | 2 | Legal Space is Banned (line 1 did not apply) | Successor: Legal Space to Prosecuted. Place Offices equal to the Successor number minus 1 (minimum 1), using the line 4 order. Remove the Successor marker. Stop. |
    | 3 | Legal Space is Open or Prosecuted | Office limit: Open 4, Prosecuted 3 [tune]. |
    | 4 | Offices on the map are fewer than the limit | Place 1 Office in the first eligible space in this order: Diyarbakır City, Western Cities, Mardin-Batman, Van-Bitlis, Şanlıurfa, Bingöl-Muş, Diyarbakır Rural, Botan, Ağrı, Adıyaman, Elazığ. Eligible: Pop 2 or more, no Office, no PKK Control, not at Active Support or Active Opposition. |
    | 5 | Offices on the map are more than the limit | Remove Offices from the eligible spaces latest in the line 4 order until at the limit. |
    | 6 | Offices on the map equal the limit and no Closure Case marker is on the track | The prosecutor files: place the Closure Case marker. Line 1 bans at the next phase (DD-19.1). |

    Notes:

    1. Line 4 is a design convenience. It stops either armed player from choosing where legal politics exists (Sol non-player actors file).
    2. Line 2 makes the successor return at the next round with fewer Offices (DD-10.3). History had successors ready before the ban: HADEP was founded 36 days before the DEP ban [E-0013; E-0014; F-015; F-052].
    3. Events may place or remove Offices and move Legal Space as printed: HEP closure [E-0186; E-0009], DEP founding and closure [E-0010; E-0197; E-0014], HADEP founding and filing [E-0013; E-0236].
    4. The 10 percent threshold kept the legal parties out of parliament [E-0153; F-016]. Offices stand for local presence, not seats.
    5. Line 6 is the non-player prosecutor. Closure cases were brought by the Chief Public Prosecutor at the Court of Cassation [O-116], not by the cabinet. The State may still file earlier by choice (section 6.3). Line 6 keeps the founding, ban and successor cycle alive when the State player has no reason to file (IR-33; F-052).
  subsections: []
- id: 07 s7
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Ceasefire (DD-11)
  text: "The Ceasefire track has three steps: None, Declared and Reciprocal Restraint. A ceasefire is temporary and never ends the game. Designer decision of 2026-11-12 (`docs/audit/OPEN_QUESTIONS.md`, item 1): no settlement step exists, because Turkish territorial integrity and Kurdish independence are directly opposed."
  subsections:
    - 7.1 Declaration
    - 7.2 Restrictions and breaches
    - 7.3 Ceasefire step (Propaganda, Legal Politics phase)
    - 7.4 Not used
- id: 07 s7.1
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Declaration
  text: From C3, the PKK may Declare Ceasefire as its action on a card, using the Limited Op box (05, section 2.3). Ceasefire must be None. Set it to Declared. Europe +1. Events may also declare for the PKK. Only the PKK declares (DD-11.2) [E-0089; E-0112; E-0123; E-0135; F-039].
  subsections: []
- id: 07 s7.2
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Restrictions and breaches
  text: |-
    | Ceasefire | PKK may not | State may not |
    |---|---|---|
    | Declared | Attack, Ambush, Strike Collaborators | No restriction. Each State Assault, Village Clearance, Cross-Border or Covert Action places the State Restraint Broken marker |
    | Reciprocal Restraint | Attack, Ambush, Strike Collaborators, Coerce, place a domestic Base (DD-19.3) | Assault, Village Clearance, Cross-Border, Covert Action |

    Breach: a faction that takes a forbidden action places its Restraint Broken marker and the Ceasefire goes to None. Free actions granted by events count as actions for this table. PKK breach: Europe -1. State breach (Reciprocal Restraint only): Legitimacy -2. A spoiler event may set the Ceasefire to None with no Restraint Broken marker and a neutral title; attribution stays as the sources state it [E-0091; E-0092; E-0093; F-038; F-053].
  subsections: []
- id: 07 s7.3
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Ceasefire step (Propaganda, Legal Politics phase)
  text: |-
    1. Declared, no State Restraint Broken marker: the State may accept. Ceasefire to Reciprocal Restraint. If it does not, the PKK keeps Declared or ends it (None). If the PKK ends a ceasefire that it declared by section 7.1, Europe -1, so a declaration that is not kept returns its Europe gain [tune].
    2. Either faction may leave Reciprocal Restraint (to None) at this step. The State pays no cost. The PKK pays Europe -1 if it leaves Reciprocal Restraint for None (step 1 rule).
  subsections: []
- id: 07 s7.4
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Not used
  text: "This section held a settlement that ended the game. It is removed (Designer decision of 2026-11-12 (`docs/audit/OPEN_QUESTIONS.md`, item 1)). Evidence: none of the historical ceasefires was recognized by the State [F-039]. The number is kept so that later section numbers do not change."
  subsections: []
- id: 07 s8
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Emergency Rule (DD-12)
  text: ""
  subsections:
    - 8.1 Steps
    - 8.2 Moves
- id: 07 s8.1
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Steps
  text: |-
    | Step | Drain at Propaganda | Unlocks | Basis |
    |---|---|---|---|
    | Martial Law | -1 | none | Start Aug 1984 [E-0039; E-0052] |
    | OHAL | -1 | Village Clearance (with OHAL Powers or C3+) | OHAL from 19 Jul 1987 [E-0055; F-013] |
    | OHAL Extended Powers | -2 | Village Clearance; Sweep 1 per space | KHK 413 and 430 [E-0057; E-0058] |
    | Normalizing | 0 | Return; no Village Clearance | Region shrank from 1994; Mardin out Nov 1996 [F-014; E-0219] |
  subsections: []
- id: 07 s8.2
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Moves
  text: |-
    1. Martial Law to OHAL: only by the OHAL card (mandatory in C2).
    2. OHAL to OHAL Extended Powers: by the OHAL Powers card, or by a State step in Propaganda from C3.
    3. In the Legitimacy phase (05, section 6.4, step 8) the State may move one step: OHAL to OHAL Extended Powers (from C3, step 2 above), OHAL Extended Powers to OHAL, OHAL to Normalizing or Normalizing to OHAL. Only Normalizing to OHAL costs Legitimacy (-1); the other steps are free. The track never returns to Martial Law (design choice).
    4. Province-level changes are event effects only (DD-12.4) [E-0219]. Parliament renewed OHAL 46 times [Q-372; F-055].
  subsections: []
- id: 07 s9
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Europe track
  text: "Range 0 to 5 (04, section 3.6). Moves: PKK Rally on Europe +1; Declare Ceasefire +1; Serhildan +1; party ban +1; Propaganda harm comparison +1 or -1; State Diplomacy -1; Strike Collaborators -1; PKK breach -1; events. The Ban marker caps it at 3 [E-0194; E-0063; E-0064; Q-377; F-040]. US designation in 1997 is an event [E-0225; F-044]. Europe is not one patron. Voluntary support and coercion in diaspora funding stay distinct in card text [M-013]."
  subsections: []
- id: 07 s10
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Kurdish Hizbullah and covert violence
  text: ""
  subsections:
    - 10.1 Kurdish Hizbullah
    - 10.2 Covert violence
- id: 07 s10.1
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Kurdish Hizbullah
  text: |-
    Event-driven only. No player owns or orders it [M-016; F-058; F-057].

    1. Card titles are neutral, for example "Unattributed killings in the southeast".
    2. Effect: if any of Botan, Mardin-Batman, Diyarbakır City and Diyarbakır Rural holds an Office, remove one Office from the highest-Pop such space. Otherwise remove one Guerrilla from the highest-Pop such space with a Guerrilla. Ties go in this order: Mardin-Batman, Diyarbakır City, Diyarbakır Rural, Botan. The executing faction does not choose the target. Place a Disputed Harm marker there.
    3. Attribution limit: a later event may turn a Disputed marker into a State Harm marker only if the card rests on a High or Moderate court or commission finding. Reported security-force links rest on a 1995 commission as relayed by HRW [F-058; E-0087]. No court has settled them.
    4. Never print the "2,000 murders" figure [Q-403].
  subsections: []
- id: 07 s10.2
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Covert violence
  text: |-
    1. Covert Action is the only player tool for covert violence (06, section 3.5). Its markers are hidden, revealable and costly [M-009].
    2. Reveal events: Susurluk [E-0015], commission reports [E-0109; E-0223], each revealing up to 2 Covert markers chosen at random.
    3. Killings of legal-party and press figures with disputed perpetrators appear only as events with Disputed Harm markers and role names, never names [F-019; E-0098; E-0189; E-0193].
    4. Court outcomes were mixed: convictions for the Susurluk gang and Agar, acquittals in JITEM cases [F-028; E-0242; E-0248; E-0249; E-0250]. Card text keeps that mix.
  subsections: []
- id: 07 s11
  file: 07-political-civilian-and-sanctuary-systems.md
  heading: Tests
  text: |-
    1. Count closure filings and successor returns per game. If the State never files, raise the Office cap effect.
    2. Count the games that reach Reciprocal Restraint. If none does, lower the cost of State acceptance.
    3. Check that the Legal Politics table never needs a judgment call. Two readers must place the same Offices.
  subsections: []
- id: 08 s1
  file: 08-event-deck.md
  heading: What the deck contains
  text: |-
    | Item | Count | Where |
    |---|---:|---|
    | Campaign pool cards (Events, Capabilities, Momentum) | 91 | Five pools, C1 to C5 |
    | Deck-eligible pool cards | 91 | `deck_eligible = yes` |
    | Research leads used as pool fillers | 0 | DK-013 and DK-014 were verified in R4 (section 3.3) |
    | Pivotal Events | 4 | Two per faction, held in hand |
    | Propaganda cards | 5 | One per pile |
    | Structural (mandatory) cards | 7 | Inside the pools, marked in `design_note` |

    A game uses 60 Event cards (5 piles of 12), 5 Propaganda cards and up to 4 Pivotal Events, as in the CT full scenario (CT 10.0). Pool cards that are not dealt stay out of the game unseen.
  subsections: []
- id: 08 s2
  file: 08-event-deck.md
  heading: Deck structure and build procedure
  text: The build follows 05, section 1.1. This chapter adds the deck data and the rules for structural cards from DD-17.1.
  subsections:
    - 2.1 Build each pile
    - 2.2 Structural cards
    - 2.3 Capture must not be a dead card
    - 2.4 Faction order symbols
- id: 08 s2.1
  file: 08-event-deck.md
  heading: Build each pile
  text: |-
    Do this for C1, then C2, C3, C4 and C5:

    1. Take the Campaign's structural cards. They are mandatory (DD-17.1).
    2. Shuffle the other deck-eligible cards of that Campaign pool. Draw until the pile has 12 Event cards. Do not use research leads, except in a declared playtest (section 3.3).
    3. Shuffle the 12 cards. Deal the top 8 face down.
    4. If a structural card is in the bottom 4, swap it with the lowest non-structural card of the top 8. If a chain pair in section 8 ends in a structural card, the earlier card of that pair also counts as structural for this step.
    5. Apply the order constraints in section 8 now, before the Propaganda card goes in.
    6. Shuffle the Propaganda card into the bottom 4. Put the 8 on top. The Propaganda card is now card 9 to 13 of the pile.
    7. Stack the piles with C1 on top.

    Cards below a Propaganda card are played in the next Campaign (CT 10.0).
  subsections: []
- id: 08 s2.2
  file: 08-event-deck.md
  heading: Structural cards
  text: |-
    | Deck ID | Card | Campaign | Always line (applies on reveal) |
    |---|---|---|---|
    | DK-003 | Law 3175 | C1 | Move all 16 Village Guards from Out of Play to Available |
    | DK-005 | KDP Orders PKK Out | C1 | If KDP is Host, set it to Tolerant |
    | DK-019 | Syria Security Protocol | C2 | If Syria is Host, set it to Tolerant |
    | DK-020 | OHAL | C2 | If Emergency Rule is Martial Law, set it to OHAL |
    | DK-037 | HEP Founded | C3 | Legal Space to Open. Run Legal Politics lines 3 and 4 twice now |
    | DK-040 | Northern Iraq Vacuum | C3 | From now on, Tolerant allows Cross-Border and PKK Bases in the KDP Zone and PUK Zone |
    | DK-093 | Capture | C5 | If the Leadership is Abroad, apply Capture (07, section 5.2). If it is Present, do nothing |

    Rules:

    1. The Always lines copy 10, section 6.1 word for word in meaning.
    2. The deck CSV has no Always column. The Always line is printed in the `design_note` field, after the words "structural, mandatory". On a printed card it goes above the two event texts.
    3. Card type stays "Event" (DD-17.1). The Always line applies whether or not a faction executes the Event (05, section 5.7).
    4. A Pivotal Event played on a structural card does not cancel its Always line (05, section 4, step 4).
    5. C4 has no structural card (10, section 6.1).
  subsections: []
- id: 08 s2.3
  file: 08-event-deck.md
  heading: Capture must not be a dead card
  text: "The Capture Always line works only while the Leadership is Abroad. Two cards can flip it: the State Pivotal Coercive Diplomacy on Syria (DK-098) and the pool card PKK Leader Leaves Syria (DK-090). The Capture card also has an unshaded branch for a Present Leadership: Syria posture one step toward Hostile. So Capture always changes the board when the State takes it."
  subsections: []
- id: 08 s2.4
  file: 08-event-deck.md
  heading: Faction order symbols
  text: Each card prints a two-symbol order, S-P or P-S, in the `faction_order` column. Chapter 05 gives this order no rule role. Eligibility comes from the Initiative track (DD-04). The symbols are kept for a future rule or for an optional module. Each pool has an equal or near-equal split (section 6). This is a gap, not a rule (section 10).
  subsections: []
- id: 08 s3
  file: 08-event-deck.md
  heading: Eligibility rule and counts
  text: ""
  subsections:
    - 3.1 The rule
    - 3.2 Counts
    - 3.3 C1 meets the DD-13.2 minimum
- id: 08 s3.1
  file: 08-event-deck.md
  heading: The rule
  text: |-
    DD-13.3 says a card is deck-eligible when its event confidence is High or Moderate and at least one source with status "Verified source" stands behind the central fact. The rule as computed:

    1. The central event is the first E- ID in the card's `event_ids`.
    2. Event confidence is the `confidence` value of that event in `historical-events.csv`. It is not the card's own column.
    3. The central fact test passes if at least one source ID is in both the card's `source_ids` and the central event's `source_ids`, and that source has `verification_status` "Verified source" in `source-registry.csv`.
    4. Background rows are never eligible. They describe a period, not a discrete event: K-082, K-083, K-103, K-104, K-111 and K-112.
    5. All other rows are "research lead".

    The result is in the `deck_eligibility` column of the register. The `scenarios` column now holds the Campaign tag from the date (C1 to C5). Background rows get the tag of their period (K-111, dated "1990s", gets C3;C4;C5). Only K-112 (the 1982 Constitution) has no tag, because it predates the campaign. The old S1 to S5 tags are gone, because DD-01 replaced those scenarios.
  subsections: []
- id: 08 s3.2
  file: 08-event-deck.md
  heading: Counts
  text: |-
    | Campaign | Register rows | Deck-eligible in register | Pool in deck | Deck-eligible in pool | Pile size | Draw choice |
    |---|---:|---:|---:|---:|---:|---|
    | C1 | 19 | 16 | 15 | 15 | 12 | 12 of 15 |
    | C2 | 22 | 20 | 18 | 18 | 12 | 12 of 18 |
    | C3 | 35 | 24 | 18 | 17 | 12 | 12 of 17 (DK-046 is a research lead since E-0082 fell to Low) |
    | C4 | 41 | 34 | 20 | 20 | 12 | 12 of 20 |
    | C5 | 43 | 33 | 20 | 20 | 12 | 12 of 20 |

    The register holds 159 rows. K-111 is counted in three Campaigns and K-112 in none. Eligible rows that are not in a pool stay in the register as reserves. Examples are the Akdivar judgment [K-090], the Saturday Mothers sit-in [K-060] and Article 8 amended [K-061]. The Pivotal source cards (K-006, K-052, K-053, K-072, K-074, K-114, K-115) leave the pools (section 4).
  subsections: []
- id: 08 s3.3
  file: 08-event-deck.md
  heading: C1 meets the DD-13.2 minimum
  text: |-
    C1 has 15 deck-eligible pool cards. DD-13.2 asks for 14. The C1 register has 16 eligible rows. One of them, K-006, is the source of the ARGK Formed Pivotal, so it cannot also be a pool card. The pool grew from 12 to 15 in the R4 verification:

    1. DK-013 Border Attack and Air Raid into Northern Iraq [K-123; E-0165]. Raised from Low to Moderate. Two Turkish press retrospectives give the 15 Aug 1986 air raid [S-0532; S-0533] and a CSM report of 2 Sep 1986 gives the Turkish reprisal claim [S-0534]. The Uludere site comes only from Wikipedia. The card prints no casualty total (C-072).
    2. DK-014 Human Rights Association Founded [K-124; E-0164]. Moderate. IHD's own page and a bianet history confirm the date and the 98 founders [S-0531; S-0530]. Both are IHD-derived, so the event stays Moderate. Soft effects only.
    3. DK-100 Neighbors Condemn the Raid [K-158; E-0340]. New. Moderate. One contemporary report [S-0534].

    The pile holds 12 cards, so each C1 game now draws 12 of 15. The leads no longer fill the pool. K-159 (martial law lifted in 11 more provinces, Mar 1985) is a research lead only: the source text could not be read [E-0341; S-0535].
  subsections: []
- id: 08 s4
  file: 08-event-deck.md
  heading: Pivotal Events
  text: |-
    The four Pivotals and their rules come from 05, section 4. Each faction holds both of its Pivotals from setup (10, section 2.3). The procedure is CT 2.3.7 as written in 05.

    | Deck ID | Faction | Pivotal | Earliest | Board precondition | Effect | Evidence |
    |---|---|---|---|---|---|---|
    | DK-015 | PKK | ARGK Formed | C1 | 8 or more Guerrillas in domestic spaces and at least 2 domestic PKK Bases | Place up to 4 Guerrillas in spaces with PKK Bases. Flip all Guerrillas there Underground. PKK +3 Resources | [E-0075] |
    | DK-054 | PKK | Serhildan | C3 | Total Opposition 14 or more; Mardin-Batman or Botan at Opposition (DD-19.5) | Shift up to 3 spaces with PKK pieces and no Office one level toward Opposition (Diyarbakır City may be one). Europe +1 | [E-0173; E-0271; E-0272] |
    | DK-076 | State | Area Domination | C4 | Emergency Rule is OHAL Extended Powers; Total Opposition 12 or more | Free Sweep, then free Assault, in up to 3 Mountain spaces. Village Clearance may accompany one of them at normal cost | [E-0202; E-0204] |
    | DK-098 | State | Coercive Diplomacy on Syria | C5 | Syria is Tolerant or Restricted; Legitimacy 5 or more | Syria to Hostile. Leadership flips to Abroad. PKK pieces in Syria-Bekaa stay but earn nothing | [E-0124; E-0126; E-0127; E-0018; E-0019] |

    Notes:

    1. The source cards of each Pivotal left the pools to avoid a double count: K-006 (ARGK), K-013 and K-113 to K-115 (Serhildan), K-052 and K-053 (Area Domination), K-072 and K-074 (Syria warnings).
    2. K-075 (the leader leaves Syria) and K-076 (Adana minutes) stay as pool cards. They are separate steps with their own decisions, and K-075 gives Capture a second route.
    3. The Serhildan source cards K-013 and K-113 are Low. The Pivotal rests on K-114 and K-115, which are Moderate with a verified source.
    4. The Area Domination effect includes Village Clearance, a harm tool. Its costs stay as in 06, section 3.4. The Pivotal gives no discount.
  subsections: []
