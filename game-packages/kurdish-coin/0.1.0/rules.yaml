  text: |-
    | CT mechanism (rule) | Decision | Use in this design | Test |
    |---|---|---|---|
    | Two-player structure (playbook p.12) | Borrow | State and PKK. Legal Politics as a system (DD-02) | Do institutional dilemmas stay real without a Security player? |
