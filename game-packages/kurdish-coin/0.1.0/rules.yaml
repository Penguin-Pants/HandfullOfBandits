- id: 11 s6.4
  file: 11-critical-design-review.md
  heading: C3 Propaganda round (round 1 of Scenario B)
  text: |-
    1. Victory phase: skipped, first round (05, section 6.1). Scores at this point, not a check: State 10 Support + 4 Legitimacy = 14 against 48 (margin -34). PKK 22 Opposition + 4 domestic Bases = 26 against 41 (margin -15). Harm counts: State 2, PKK 3 (1 PKK Harm marker, 2 Coercion markers), Disputed 1.
    2. Resources: State 8 + 2 (Legitimacy 4 / 2) + 12 (Botan 2, Mardin-Batman 4, Elazığ 2, Van-Bitlis 4) = 22, so 27. PKK 4 domestic Bases + KDP Zone Base 1 + Syria-Bekaa Base 1 + Leadership 1 (Syria Tolerant) + Europe 2 = 9, so 10. The income gap is about 2.4 to 1 (IR-06).
    3. Upkeep: 7 Guards, pay 4. State 23.
    4. Legitimacy: OHAL -1, New Displacement -1, Europe 5 -1. No gain: Legal Space is Prosecuted, the Ceasefire is only Declared and a marker flipped (so the IR-08 offset did not apply). Legitimacy 1. Emergency Rule step: the State moves OHAL to Normalizing. The step list in 07, section 8.2, item 3 left out OHAL to OHAL Extended Powers, which item 2 allows (IR-44).
    5. Legal Politics: no filing (a marker is on the track). Line 1: Ban. Successor marker at 2. Both Offices removed. Legitimacy -2 takes it from 1 to 0; the second point was unpaid and cost nothing as written (IR-35). Europe stays at its maximum 5. Ceasefire step: the State accepts. Reciprocal Restraint.
    6. Civic Action: the cap is Legitimacy 0 / 2 = 0. The State has 23 Resources and spends none. Agitation: only Bingöl-Muş has a PKK piece and no State Control, and it is already at Active Opposition. The PKK pays Redress 2 for its own PKK Harm marker there. PKK 8.
    7. Redeploy: no moves. Reset: both Coercion markers removed, all Guerrillas Underground, Campaign C4, PKK First Eligible.

    **Scores at the end of phase 6.6, not a check: State 10 against 48 (margin -38). PKK 26 against 41 (margin -15).** Harm counts after Reset: State 2, PKK 0, Disputed 1. Legitimacy 0, Europe 5, Normalizing, Reciprocal Restraint, Legal Space Banned (Successor 2).

    Ownership measure (DD-02 flip trigger; 02, section 5.1, item 1): on cards, the State changed one decision because of Offices (card 2) and the PKK changed two (card 1 before HEP, card 6 filing). In the Propaganda round no player had a Legal Politics decision: the case was already on the track, and a State without it had no reason to file while Offices pay it Legitimacy +1 (IR-33).
