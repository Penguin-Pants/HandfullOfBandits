- id: 02 s2.3
  file: 02-faction-architecture-decision.md
  heading: What the two scorecards show
  text: |-
    1. **The weights do not drive the gap.** Claude cells with Sol weights give MOD-2 3.49 and MOD-3B 3.84. Sol cells with Claude weights give MOD-2 4.15 and MOD-3B 3.93. The order stays with each rater's cells (recomputed for this chapter).
    2. **The raters agree on MOD-3B.** Both give 3.89. They differ by one point only on balance.
    3. **The raters disagree on MOD-2.** Sol scores it one point higher on fidelity, agency, objectives, decisions, interaction and replay. Claude scores it one point higher on balance. This one row decides the order.
    4. **The raters disagree on MOD-3A.** Sol gives 3.44, Claude 2.87. Sol credits it with more objectives and decisions. Claude marks fidelity down because the State acted as one on the PKK [F-026].
  subsections: []
- id: 02 s2.4
  file: 02-faction-architecture-decision.md
  heading: Claude sensitivity and perturbation
  text: |-
    Claude ran four alternative weight sets (`audit/scoring-output/faction_scores.json`).

    | Run | MOD-2 | MOD-3B | MOD-4A | Leader |
    |---|---:|---:|---:|---|
    | Base | 3.54 | 3.89 | 3.45 | MOD-3B |
    | History-heavy | 3.44 | 3.97 | 3.39 | MOD-3B |
    | Playability-heavy | 3.64 | 3.70 | 3.42 | MOD-3B by 0.06 |
    | Ethics-heavy | 3.42 | 4.17 | 3.57 | MOD-3B |
    | Equal | 3.64 | 3.82 | 3.45 | MOD-3B |

    A perturbation test changed every cell by -1, 0 or +1 and repeated 5,000 times. MOD-3B ranked first in 79.4 percent of draws, MOD-2 in 13.6 percent and MOD-4A in 6.9 percent (`tools/faction_scoring.py`; `audit/scoring-output/perturb.json`). With uniform noise MOD-3B led in 73.1 percent. Claude's additional runs found two views where MOD-2 leads (Claude `01-evaluation-method.md`, section 7):

    1. Balance, complexity and flexibility counted three times: MOD-2 3.88, MOD-3B 3.59.
    2. Objectives, asymmetry and ethics dropped (they all reward one addition): MOD-2 3.65, MOD-3B 3.50.

    A swap on fidelity alone (MOD-3B 3, MOD-2 4) also reverses the lead. Sol's own fidelity score for MOD-2 is 4.
  subsections: []
- id: 02 s2.5
  file: 02-faction-architecture-decision.md
  heading: Single-rater caveat
  text: |-
    Each scorecard has one rater. Each rater also proposed the models it scored. The two raters are not independent of each other: both are AI consolidations that read the same inherited packages. Their agreement on MOD-3B is therefore weak evidence. The perturbation tests add random noise per cell. They cannot detect one rater's correlated bias (Claude `08-recommendation.md`, section 3; R5 D12). Objectives, asymmetry and ethics overlap. All three reward the Legal Movement, so one idea may count three times.

    Judgment (High): neither scorecard can decide between MOD-2 and MOD-3B. The scores only rule out MOD-3A, MOD-3C, MOD-3D and MOD-4B as main options. Those trail in every Claude run.
  subsections: []
- id: 02 s3
  file: 02-faction-architecture-decision.md
  heading: Why the full-campaign scope changes the decision
  text: |-
    Both inputs scored their models for a 1993-1995 first test. DD-01 replaces that scope with the full 1984-1999 campaign. Four facts follow.

    1. **The legal seat is absent for about 38 percent of the campaign.** No legal pro-Kurdish party existed before HEP, founded 7 Jun 1990 [E-0007; O-030; F-015]. Aug 1984 to Jun 1990 is about 70 of 185 months. In C1 and C2 a Legal Movement player would have no historical basis. Claude's own CSV note says the Legal Movement exists only from 1990. Sol restricted its fallback to 1991 or later.
    2. **The C1 and C2 structure needs no third seat.** C1 and C2 hold martial law, the Law 3175 Guards, the KDP break and the move to OHAL [E-0004; E-0160; E-0055]. All of these are State, PKK or host matters.
    3. **Flexibility and agency weigh more over fifteen years.** A seat that sits idle for two Campaigns loses agency and flexibility. As an illustration, cut MOD-3B by one point on each. Under Claude cells it falls from 3.89 to 3.70, still above MOD-2 at 3.54. So the scorecard alone does not flip under Claude cells. Under Sol cells MOD-2 already leads.
    4. **The split-state models get weaker.** Ankara has little to do in 1984-1987 (Claude CSV note on MOD-3A). The open civil-military splits concern Iraq and Islamism [F-026; F-060]. In C1 and C2, MOD-4A would play as MOD-3A.

    Judgment (Moderate): the decision rests on the DD-02 reasons, not on the scorecard. Those reasons are scope (fact 1), the open status of C-025, the CT precedent for keeping institutional tension inside two players and the fragile margin of the MOD-3B lead.
  subsections: []
- id: 02 s4
  file: 02-faction-architecture-decision.md
  heading: Final decision (DD-02)
  text: |-
    | Role | Architecture | Scope |
    |---|---|---|
    | Core game | MOD-2: Turkish State and PKK | C1 to C5 |
    | Non-player system | Legal Politics (DD-10) | Switches on in C3 |
    | Optional module | MOD-3B Legal Movement player | C3 to C5 only |
    | Documented experiment | MOD-4A split state with Cohesion track | C3 to C5 only. See 13-optional-modules.md |
    | Later map experiment | Concept B hybrid map | Any architecture |
    | Rejected | MOD-3A, MOD-3C, MOD-3D, MOD-4B | None |

    **Confidence: Moderate.** It is Moderate, not High, because the two scorecards disagree on MOD-2 and neither has a second blind rater.
  subsections:
    - 4.1 Why each input moves
    - 4.2 What the non-player system must do
- id: 02 s4.1
  file: 02-faction-architecture-decision.md
  heading: Why each input moves
  text: |-
    1. **Claude** recommended MOD-3B and kept MOD-2 as fallback. Its own build order builds the MOD-2 core first and tests it in Stage 0 (Claude `08-recommendation.md`, section 6). The final decision keeps that order and stops at a decision point after the core.
    2. **Sol** recommended MOD-2 and kept a legal third player as fallback. Its promotion test (political outcomes stay passive) becomes the DD-02 flip trigger.
    3. Both inputs agree on the path. They disagree only on which side of the decision point to expect.
  subsections: []
- id: 02 s4.2
  file: 02-faction-architecture-decision.md
  heading: What the non-player system must do
  text: |-
    Sol named the main weakness of MOD-2: the legal actors have no human advocate. The armed players may use the system as a score adjustment (Sol `03`, "Two factions"). The Legal Politics system must therefore:

    1. Act on its own schedule each Propaganda round (DD-10; Claude `scenarios-and-victory/03-scenarios.md`, section 3.4 as the base).
    2. Not be movable by the PKK (DD-10.5).
    3. Charge the State Legitimacy for a ban, at every board state (DD-10.4).
    4. Return a successor at the next Propaganda round with fewer Offices (DD-10.3) [F-052].
    5. Add to neither armed player's victory score (DD-10.5).
  subsections: []
- id: 02 s5
  file: 02-faction-architecture-decision.md
  heading: Flip triggers
  text: ""
  subsections:
    - 5.1 Promote MOD-3B to the default for C3 to C5
    - 5.2 Keep MOD-2 and retire the MOD-3B module
    - 5.3 Reopen the split state (MOD-4A)
    - 5.4 Revisit the scorecard
- id: 02 s5.1
  file: 02-faction-architecture-decision.md
  heading: Promote MOD-3B to the default for C3 to C5
  text: |-
    1. C3 to C5 playtests show Legal Politics decisions are passive or owned by an armed player (DD-02). Measure: in more than half of recorded Propaganda rounds, neither player changes a decision because of the Legal Space or Office state.
    2. A post-test review asks which major actor had decisions shown only as an automatic reaction (Sol `03`). Legal politics is named in most sessions.
    3. The MOD-3B module passes its own promotion tests (13-optional-modules.md, section A.9).
  subsections: []
- id: 02 s5.2
  file: 02-faction-architecture-decision.md
  heading: Keep MOD-2 and retire the MOD-3B module
  text: |-
    1. A source set shows the legal parties acted as PKK organs. C-025 would close against autonomy [F-018].
    2. The module test shows fewer than four distinct legal options per turn (Claude spec, section 5.3 threshold).
    3. The Legal Movement player becomes a routine kingmaker (Sol `14`, "Architecture B").
  subsections: []
- id: 02 s5.3
  file: 02-faction-architecture-decision.md
  heading: Reopen the split state (MOD-4A)
  text: |-
    1. Primary sources show durable, separate aims for civil and security centers on the Kurdish question [F-026].
    2. A review of the 1993 decisions shows institutional, not personal, causes (M-003).
    3. Unified State choices repeatedly need policy coordination that institutional constraints cannot show economically (Sol `03`, "Decision and rejection tests").
  subsections: []
- id: 02 s5.4
  file: 02-faction-architecture-decision.md
  heading: Revisit the scorecard
  text: |-
    1. A second, blind rater scores MOD-2, MOD-3B and MOD-4A with the criteria in section 2.1.
    2. Each weight gets a written reason in `tools/faction_scoring.py`.
    3. A decision count replaces opinion scores: list the real choices each faction has on a sample turn in 1985, 1993 and 1998 (Claude `08-recommendation.md`, section 3).
  subsections: []
- id: 02 s6
  file: 02-faction-architecture-decision.md
  heading: Build order
  text: |-
    1. **MOD-2 core, Scenario A first.** Build the State and PKK, the host posture tracks, Guards, Legitimacy, Emergency Rule and Ceasefire. Test Scenario A (C1 and C2) with the CT Initiative track (DD-04), as the playtest plan orders (12). Scenario A has the fewest systems switched on. The 1993-1995 material from both inputs follows in Scenario B (DD-01.2).
    2. **Add the other Campaigns.** Add C1 and C2 (no Legal Space) and C3 and C5. Test that the structure changes by rule at each Reset (DD-01).
    3. **Add the non-player Legal Politics system** from C3 (DD-10). Test the ban and successor cycle.
    4. **Decision point.** Apply the flip triggers in section 5.1 and 5.2.
    5. **Test the MOD-3B module** in C3 to C5 (13-optional-modules.md, part A).
    6. **Only then test MOD-4A** (13-optional-modules.md, part B). Do not change map, pieces and scoring in the same test (Sol `14`, "Architecture A").
    7. **Concept B map** last, against the DD-05 map with the same card sequence (13-optional-modules.md, part C).

    This order keeps a working game at every step. If step 5 fails, the project keeps the core from steps 1 to 3. Judgment confidence: High for core-first. Moderate for Scenario A first, because it has the fewest systems but the thinnest card evidence (C1 pool, see 08).
  subsections: []
- id: 02 s7
  file: 02-faction-architecture-decision.md
  heading: What this decision does not claim
  text: |-
    1. It does not claim the conflict had only two meaningful actors (Sol `03`, "Method and scope").
    2. It does not claim the legal parties were or were not independent of the PKK [F-018; C-025].
    3. It does not claim the State was unified on every matter. The unity finding covers the PKK and Syria [F-026].
    4. It does not claim that either scorecard is evidence.
  subsections: []
- id: 03 s1
  file: 03-map-and-spaces.md
  heading: Map overview
  text: |-
    The map has 13 domestic spaces and five external boxes.

    1. Domestic spaces hold pieces of both factions. They count for victory.
    2. External boxes hold PKK pieces only, except the KDP Zone and PUK Zone during a State Cross-Border action (06, section 3.2). External boxes never count for victory (DD-14.4).

    One Pop is about 250,000 people. Pop values are design weights rounded from 1990 province totals [Q-004; Q-012; Q-018; Q-026; Q-035; Q-044; Q-045; Q-046; Q-053; Q-061; Q-079; Q-087; Q-096; Q-104; Q-109; Q-117; Q-125]. Most of these rows have Low confidence. Pop is not a count of Kurds and does not measure ethnic preference [Q-168; Q-169; M-028]. Print "[design]" beside every Pop value on the board.
  subsections: []
- id: 03 s2
  file: 03-map-and-spaces.md
  heading: Domestic spaces
  text: |-
    | Space | 1990s provinces | Terrain | Pop | Foreign border | Basis for Pop (1990 total, rounded) |
    |---|---|---|---:|---|---|
    | Hakkari | Hakkari | Mountain | 1 | Iraq, Iran | 172,479; raised to minimum 1 [Q-061] |
    | Botan | Şırnak, Siirt | Mountain | 2 | Iraq, Syria (note 2) | 262,006 + 243,435 = 505,441 [Q-109; Q-096] |
    | Mardin-Batman | Mardin, Batman | Plain | 4 | Syria | 557,727 + 344,669 = 902,396, rounds to 3.6 and so 4 [Q-079; Q-018] |
    | Diyarbakır City | Diyarbakır (urban) | City | 2 | none | 600,640 [Q-045] |
    | Diyarbakır Rural | Diyarbakır (rest) | Plain | 2 | none | 494,356 [Q-046] |
    | Şanlıurfa | Şanlıurfa | Plain | 4 | Syria | 1,001,455 [Q-104] |
    | Adıyaman | Adıyaman | Plain | 2 | none | 513,131 [Q-004] |
    | Elazığ | Elazığ | Plain | 2 | none | 498,225 [Q-053] |
    | Dersim | Tunceli | Mountain | 1 | none | 133,143; raised to minimum 1 [Q-117] |
    | Bingöl-Muş | Bingöl, Muş | Mountain | 3 | none | 250,966 + 376,543 = 627,509 [Q-026; Q-087] |
    | Van-Bitlis | Van, Bitlis | Mountain | 4 | Iran | 637,433 + 330,115 = 967,548 [Q-125; Q-035] |
    | Ağrı | Ağrı | Mountain | 2 | Iran | 437,093 [Q-012] |
    | Western Cities | Istanbul, Ankara, İzmir, Adana, Mersin (abstract) | City | 3 | none | Design node, no census basis [L-035; Q-176] |

    Total domestic Pop: 32. Without Western Cities: 29. Mardin-Batman is 4 per the corrected DD-05 (grouped 1990 total, half-up rounding).

    Notes:

    1. Place names follow the location registry rule: Turkish name first, Kurdish name where sourced (DD-15.5). Print "Dersim" as the space name with "Tunceli" as the province name, because the registry gives Dersim as the historical regional name [L-016]. Print Amed beside Diyarbakır City [L-010]. Other Kurdish names in the registry are marked "n/v" or "model knowledge" and are not printed until verified [L-021 to L-030].
    2. Şırnak province borders Syria as well as Iraq, near Cizre (source in section 4). DD-17.2 records the border. The short Syrian border has no game effect, because Syria-Bekaa is not a movement space for State pieces and its PKK link uses Mardin-Batman and Şanlıurfa only.
    3. Terrain is a design tag. Only provincial seat elevations were found in the research. Mountain and Plain tags follow DD-05. Mark them "unverified assumption" in the Playbook until a terrain source is read.
  subsections:
    - 2.1 Terrain effects
- id: 03 s2.1
  file: 03-map-and-spaces.md
  heading: Terrain effects
  text: |-
    | Terrain | Effect |
    |---|---|
    | Mountain | Sweep and Garrison activate one Underground Guerrilla per 2 eligible State pieces, round down. Assault removes one PKK piece per 2 Troops, round down (CT 1.3.2, 3.2.2 to 3.2.4). |
    | Plain | No modifier. |
    | City | Police count as Troops for Assault (CT 3.2.4). PKK may Rally in a City only if it is Neutral or Opposition (CT 3.3.1). Exception: the PKK may also Rally in Western Cities at Passive Support or Active Support (urban migrant networks). This stops a lockout, because Western Cities has no land links. The Passive-only exception failed in the Scenario B desk test: once Western Cities reached Active Support, no PKK action could reach it (11, section 6; IR-36) [tune]. PKK may not place a Base in Western Cities. Village Guards may not be placed in a City. Village Clearance may not target a City. |
  subsections: []
- id: 03 s3
  file: 03-map-and-spaces.md
  heading: External boxes
  text: |-
    | Box | Who may enter | How | Pop | Notes |
    |---|---|---|---:|---|
    | Syria-Bekaa | PKK only | Rally if Syria posture permits; March to or from Mardin-Batman or Şanlıurfa if Syria is Host or Tolerant | 0 | Holds the PKK Leadership marker. State pieces never enter (CT 1.3.4, 5.1.8 pattern) [F-007; F-020; E-0053; L-088] |
    | KDP Zone | PKK; State by Cross-Border only | March from Hakkari, Botan or PUK Zone; Rally if KDP posture permits | 0 | Bahdinan border area [L-031; F-022] |
    | PUK Zone | PKK; State by Cross-Border only | March from KDP Zone only; Rally if PUK posture permits | 0 | Soran area near Iran [L-032; F-022] |
    | Iran | PKK only, by event | No Rally, no March. Events may place or remove up to 2 Guerrillas | 0 | Evidence is Low [F-025; E-0166]. A Low-confidence event carries no hard effect (DD-15.4) |
    | Europe | No pieces | Off-map track (04, section 3.6) | 0 | Diaspora resources and international pressure [L-033; F-040] |

    Rules for all external boxes:

    1. External boxes have no Support or Opposition and no Control. They never count for victory.
    2. A host posture change never deletes pieces in a box. It suspends Rally and income there (DD-09.5).
    3. For Rally, treat an external box as Pop 1 when you compute the Guerrilla limit at a Base (CT 1.3.4).
    4. State pieces in the KDP Zone or PUK Zone after a Cross-Border action must leave in the next Redeploy phase (05, section 6.7).
    5. The PUK Zone touches no domestic space. Turkey's Iraqi border in this map faces the KDP-held Bahdinan area [L-031; L-060; L-069]. This is a design simplification, not a party territorial map.
  subsections:
    - 3.1 How each host works in play
- id: 03 s3.1
  file: 03-map-and-spaces.md
  heading: How each host works in play
  text: |-
    | Box | PKK uses | State answer | Closes when |
    |---|---|---|---|
    | Syria-Bekaa | Leadership safety, training Base, entry to the Syrian border spaces | Diplomacy SA, Pivotal Event "Coercive Diplomacy on Syria", events | Syria posture reaches Hostile. Leadership flips to its Abroad side. Capture is an event effect only (DD-09.6) [F-020; F-021] |
    | KDP Zone | Camps near the border, staging into Hakkari and Botan | Cross-Border SA, Diplomacy SA, events | KDP posture reaches Restricted or worse. Cross-Border opens [F-022; F-023; F-059] |
    | PUK Zone | Rear area behind the KDP Zone | Cross-Border SA (only if KDP posture also permits), Diplomacy SA | PUK posture reaches Restricted or worse [F-022] |
    | Iran | Event-driven deniable use | Events only | Never by rule |
    | Europe | Resources and political pressure | Diplomacy SA, events (bans) | Ban marker caps the track (04) [E-0064] |

    Posture effects are in 07, section 5. Closing one host never moves another automatically (DD-09.1).
  subsections: []
- id: 03 s4
  file: 03-map-and-spaces.md
  heading: Adjacency
  text: |-
    Two domestic spaces are adjacent if any province in one shares a land border with any province in the other (CT 1.3.5). Province borders were checked on 26 Oct 2026 against the Turkish Wikipedia province articles: Hakkâri (il), Şırnak (il), Siirt Province (English article), Mardin (il), Batman Province (English article), Diyarbakır (il), Adıyaman (il), Elazığ (il), Tunceli (il), Bingöl (il), Muş (il), Bitlis (il), Van (il) and Ağrı (il), at https://tr.wikipedia.org/wiki/ and https://en.wikipedia.org/wiki/. These are tertiary sources. Confidence: Moderate. Verify against an official province map (General Directorate of Mapping) before print.

    Province borders found (domestic provinces only):

    | Province | Borders (map provinces) | Off-map neighbors |
    |---|---|---|
    | Hakkari | Şırnak, Van | Iraq, Iran |
    | Şırnak | Hakkari, Van, Siirt, Mardin | Iraq, Syria |
    | Siirt | Şırnak, Van, Bitlis, Batman, Mardin | none |
    | Batman | Siirt, Bitlis, Muş, Diyarbakır, Mardin | none |
    | Mardin | Şırnak, Siirt, Batman, Diyarbakır, Şanlıurfa | Syria |
    | Diyarbakır | Batman, Mardin, Şanlıurfa, Adıyaman, Elazığ, Bingöl, Muş | Malatya |
    | Şanlıurfa | Mardin, Diyarbakır, Adıyaman | Gaziantep, Syria |
    | Adıyaman | Diyarbakır, Şanlıurfa | Malatya, Kahramanmaraş, Gaziantep |
    | Elazığ | Diyarbakır, Bingöl, Tunceli | Malatya, Erzincan |
    | Tunceli | Elazığ, Bingöl | Erzincan |
    | Bingöl | Elazığ, Tunceli, Diyarbakır, Muş | Erzincan, Erzurum |
    | Muş | Bingöl, Diyarbakır, Batman, Bitlis, Ağrı | Erzurum |
    | Bitlis | Muş, Ağrı, Van, Siirt, Batman | none |
    | Van | Ağrı, Bitlis, Siirt, Hakkari, Şırnak | Iran |
    | Ağrı | Muş, Bitlis, Van | Kars, Erzurum, Iğdır, Iran |

    Two corrections to the input concepts follow from this check. Elazığ does not border Adıyaman (Malatya lies between). Batman has a short border with Muş.
  subsections:
    - 4.1 Printed adjacency list
    - 4.2 Western Cities
    - 4.3 Adjacency diagram
