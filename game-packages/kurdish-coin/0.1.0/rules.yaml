- id: 01 s3.2
  file: 01-comparative-coin-research.md
  heading: The largest change from both inputs
  text: Sol drafted a ranked-choice initiative procedure. It ranked both players' choices and gave priority to the smaller action. CT gives next priority from the first player's choice only (CT 2.3.5). The Sol draft also said that passing loses initiative while its procedure could reward passing with priority (CT lessons, "The largest revision"). DD-04 replaces the Sol procedure with the CT pattern. Claude already used the CT track in its two-faction mode (Claude `faction-architectures/02-mod-2.md`, section 3a).
  subsections: []
- id: 01 s3.3
  file: 01-comparative-coin-research.md
  heading: Where the analogy breaks
  text: |-
    1. **Endpoint.** CT ends in a colonial exit. This conflict ends with territorial integrity, a changed PKK aim and continued conflict [F-037; F-061].
    2. **Legal politics.** CT has no legal party. The evidence does not support treating legal parties as PKK organs [F-018; C-025].
    3. **Government pieces.** The CT French and Algerian split must not become a Turkish and Kurdish split of State pieces. Guards are local and conditional [F-011; F-057].
    4. **Hosts.** Syria, the KDP and the PUK changed on their own interests [F-020; F-022; F-051].
    5. **Termination.** A ceasefire and the capture of the leader do not give automatic victory or destroy the organization [F-021; F-038; E-0020].
  subsections: []
