- id: 01 s3
  file: 01-comparative-coin-research.md
  heading: Colonial Twilight as the primary mechanical reference
  text: CT is a two-player game with a full campaign of five Campaigns (CT 10.0). That matches DD-01 and DD-02. Its designer chose two players and moved the French Army, settlers and rival nationalists into events and systems (CT playbook p.12, per CT lessons). This supports the method of DD-02. It does not show that French and Turkish institutions were alike.
