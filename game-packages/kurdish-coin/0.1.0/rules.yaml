  heading: Merged comparison of COIN volumes
  text: |-
    The table merges the Claude faction and victory table with the Sol verified-section review. Rule numbers were re-checked against the local rules files for this chapter.

    | Volume | Factions | Victory (rule) | Best contribution here | Merge note |
    |---|---|---|---|---|
    | Andean Abyss (AA) | Government, FARC, AUC, Cartels | Gov: Total Support over 60. FARC: Opposition plus Bases over 25. AUC: more Bases than FARC (7.2) | Responder options depend on first choice (2.3). Final card before last Propaganda allows only Limited Ops (2.3.9) | Sol adds that AA shows the next card. CT does not (CT 2.2) |
    | Cuba Libre (CL) | Government, 26July, Directorio, Syndicate | Gov: all Cities Active Support and Total Support over 18. 26July: Opposition plus Bases over 15 (7.2) | US Alliance sets Government cost (CL 3.2). Designer rejects body-count reading of pieces (playbook "The Numbers Game") | Sol point on piece abstraction kept |
    | A Distant Plain (ADP) | Coalition, Government, Taliban, Warlords | Coalition: Support plus Available pieces over 30. Gov: COIN-Controlled Pop plus Patronage over 35. Taliban: Opposition plus Bases over 20 (7.2) | Islamabad track for host posture (6.6.1). Three opinion levels (1.6.1). Shared COIN Control (1.7) | Claude: reject automatic Reset drift. Sol: Air Strike can reach Pakistan and moves the track (4.2.3). Both kept |
    | Fire in the Lake (FITL) | US, ARVN, NVA, VC | US: Support plus Available Troops and Bases over 50. ARVN: COIN-Controlled Pop plus Patronage over 50. NVA and VC formulas (7.2) | Shared Control with separate scores. Monsoon before each Coup (2.3.9). Pivotal Events | An inherited summary called Laos and Cambodia insurgent-only. Claude's audit marked that claim WRONG. They are open spaces (FITL 6.7). Pivotal Events (2.3.8) |
    | Colonial Twilight (CT) | Government, FLN | Gov: Support plus Commitment over 35. FLN: Opposition plus Bases over 30 (7.2). Margins after final round (7.3) | Two-player Initiative track (2.3). Full 1954-1962 campaign in five piles (10.0). See section 3 | Primary reference (DD-04, CT lessons) |
    | British Way (BW), four games | British vs MCP, Mau Mau, EOKA, Jewish insurgents | Malaya: one Political Will track. MCP wins at 0-2, British at 18-20 (Malaya 6.1.3) | Simpler 2-player initiative (Cyprus 2.3.2-2.3.5). Designer note on civilians abstracted | Claude used Malaya only. Sol: Cyprus and Palestine replace resources with intel and arms caches (1.6). The four games differ |
    | People Power (PP) | Government, NPA, Reformers | Gov: Controlled Pop plus Patronage over 18. Reformers: Opposition plus Bases over 12. NPA: Resistance plus Bases over 13 (7.1) | Nonviolent third faction. Three alignments (1.6). Three-faction eligibility (2.3) | Claude row omitted the Government formula and misread the Protest pool. Fixed: the four Protest/Strike markers are shared with the NPA (1.8.2) |
    | Gandhi (GAN) | Raj, Congress, Muslim League, Revolutionaries | Raj: Support plus Raj-Controlled Pop over 38. Congress: Opposition over 20. League: Muslim Opposition plus twice Muslim States Pop over 14. Revolutionaries: Unrest Pop plus Bases over 14 (7.2) | Nonviolent factions cannot Control (1.7.1). Jail box (1.3.9). NV operations cost no Resources and are capped by a track (3.3) | Claude left the victory cell blank. Filled from 7.2 |
    | The Guerrilla Generation (Peru game) | Not verified | Not verified | Publisher describes emergency institutions, local self-defense forces and leadership vulnerability | Unverified. No rulebook in the local library. See section 4.6 |

    Conflicts noted between the inputs:

    1. **Coverage.** Sol reviewed six volumes (AA, CL, ADP, FITL, CT, BW). Claude reviewed eight (adds PP and GAN). The merged table keeps all eight.
    2. **Opinion levels.** CT and ADP use three levels (CT 1.6; ADP 1.6.1). AA, CL and FITL use five, with Active counting double (FITL 1.6.2). DD-06 uses five levels. That is an adaptation of CT, not a copy.
    3. **Settlement.** Claude found no GMT volume with a settlement track. Sol found that open negotiation never binds players (AA 1.5.2; CT 1.5.2). Both points agree. The Ceasefire track (DD-11) is a new mechanic.
    4. **France Track.** An earlier summary called it a patron constraint on the Government. The CT text shows an FLN-driven track (CT 1.3.8, 6.2.2). The merged reading follows the rulebook.
