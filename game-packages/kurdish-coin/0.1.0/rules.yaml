    | Response after Event or Pass | Adapt | CT text gives no rule. The design states one and labels it a design choice (DD-04.3) | Same as above |
    | Pass reward (2.3.3) | Borrow | State +2, PKK +1 (DD-04.4) | Pass cycles stay rare |
    | No next-card preview (2.2) | Borrow | DD-04.5 | Check that key actions do not depend on luck alone |
    | Five piles of 12 plus one Propaganda (10.0) | Adapt | One pile per Campaign. Propaganda card in the bottom third (DD-13.1) | About 9 to 12 cards per Campaign |
    | Pivotal Events with preconditions (2.3.7, 5.1.6-5.1.8) | Adapt | Board preconditions plus an earliest Campaign (DD-13.4) | A 1998 crisis cannot enter C2 |
    | Capabilities and Momentum (5.3, 5.4) | Borrow | DD-13.5 | None needed |
    | Detection before removal (3.2.3, 3.2.4) | Borrow | Underground PKK pieces | A hidden network has counterplay |
    | Control by piece count (1.7) | Borrow | DD-06.1. Guards count in home space only | A Controlled space can stay politically unsettled |
    | Support and Opposition as abstractions (1.6; playbook pp.13-14) | Adapt | Five levels, not three (DD-06.2) | Five levels add decisions, not bookkeeping |
    | Terror sets Neutral, never Opposition (3.3.4) | Borrow | PKK coercion moves toward Neutral (DD-06.5) | Coercion never builds allegiance |
    | Pacification needs Control, Troops and Police and Resources (6.3.1) | Adapt | Civic Action needs Control, police presence and resources (DD-06.4) | Money alone does not buy consent |
    | Commitment (1.8, 6.2.3, 7.2) | Reject as "political will" | Legitimacy is a separate national track (DD-03.3, DD-06.3) | Legitimacy creates choices without a second resource |
    | Resettle to Pop 0 (4.2.1) | Reject | Displacement never lowers Pop (DD-07.3) | Emptying a space never improves a score |
    | Subvert converts Algerian cubes (4.3.2) | Reject | A removed Guard never becomes a PKK piece (DD-08.4) | No automatic recruits |
    | Morocco and Tunisia sanctuary (1.3.4, 5.1.8) | Adapt | Syria-Bekaa off-map box. KDP and PUK Zones as restricted spaces (DD-05) | Closing one host does not close the others (DD-09.1) |
