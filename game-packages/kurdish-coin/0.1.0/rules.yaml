    | Outcome record sheet (09, section 6) | G | Record only (DD-14.5) |
    | Play time and setup time | G | Load |
    | Content comments; "Did any card feel wrong?"; "What do you want to check against a source?" | G | Tone (Claude 03, Debrief) |
  subsections: []
