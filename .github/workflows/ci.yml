name: CI

# Root Markdown changes do not start a build: `make check` and `make test` read no root Markdown
# file. docs/ stays in: `make test` checks the print set against the rules and cards
# (sim/test/print-drift.test.ts). research/ stays in: `make test` compares the package rules.yaml
# with the research documents.
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  pull_request:
    paths-ignore:
      - '*.md'

jobs:
  sim:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: make install
      - run: make check
      - run: make test
