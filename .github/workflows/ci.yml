name: CI

# Docs-only changes do not start a build. The filter runs CI for every path except root Markdown
# files and docs/, then adds back the docs files that `make test` reads: the print sources and
# outputs checked by sim/test/print-drift.test.ts. research/ stays in: `make test` compares the
# package rules.yaml with the research documents. Later patterns override earlier ones.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - 'docs/rules/**'
      - 'docs/card-catalogue/**'
      - 'docs/printdata.py'
  pull_request:
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - 'docs/rules/**'
      - 'docs/card-catalogue/**'
      - 'docs/printdata.py'

jobs:
  sim:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: make install
      - run: make check
      - run: make test
