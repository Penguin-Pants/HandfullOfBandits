model: ct-two-faction@1
boxes:
  - {id: event, label: Event}
  - {id: limitedOp, label: Limited Op}
  - {id: opOnly, label: Op Only}
  - {id: opSa, label: Op + SA}
  - {id: pass, label: Pass}
adjacency: [[pass, event], [pass, limitedOp], [pass, opOnly], [pass, opSa], [opSa, event], [opSa, limitedOp], [limitedOp, opOnly]]
swapAfter: [opOnly, opSa]
firstEligibleAtStart: red
passIncome: {blue: 2, red: 1}
